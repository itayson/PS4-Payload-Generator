name: Temporary Tayson PS4 Link Sender 1.0.1 Build

on:
  push:
    branches:
      - build/tayson-ps4-link-sender-1.0.1

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore validated Suite 1.0.8 source artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          curl -fL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o /tmp/tayson108.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10276905219/zip"
          rm -rf /tmp/tayson108 /tmp/TaysonPS4LinkSender-1.0.1
          mkdir -p /tmp/tayson108 /tmp/TaysonPS4LinkSender-1.0.1
          unzip -q /tmp/tayson108.zip -d /tmp/tayson108
          test -s /tmp/tayson108/TaysonPS4Suite-1.0.8-source.tar.gz
          tar -xzf /tmp/tayson108/TaysonPS4Suite-1.0.8-source.tar.gz \
            -C /tmp/TaysonPS4LinkSender-1.0.1 --strip-components=1
          test -f /tmp/TaysonPS4LinkSender-1.0.1/app/src/main/java/com/tayson/ps4linksender/MainActivity.kt
          test -f /tmp/TaysonPS4LinkSender-1.0.1/app/src/main/java/com/tayson/ps4linksender/ps4/ReceiverClient.kt

      - name: Apply Link Sender 1.0.1 friendly error patch
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/TaysonPS4LinkSender-1.0.1
          python3 "$GITHUB_WORKSPACE/ci101/patch_sender_101.py"
          grep -q 'versionCode = 15' app/build.gradle.kts
          grep -q 'versionName = "1.0.1"' app/build.gradle.kts
          grep -q '1.0.1 • PS4 Receiver 1.0.8+' app/src/main/java/com/tayson/ps4linksender/MainActivity.kt
          grep -q 'Mantenha o Tayson PS4 Receiver aberto' app/src/main/java/com/tayson/ps4linksender/MainActivity.kt
          grep -q 'ReceiverErrorMapper.toUserMessage(reason)' app/src/main/java/com/tayson/ps4linksender/ps4/ReceiverClient.kt
          grep -q 'Espaço insuficiente no armazenamento do PS4' app/src/main/java/com/tayson/ps4linksender/ps4/ReceiverErrorMapper.kt
          grep -q '0x80990085' app/src/main/java/com/tayson/ps4linksender/ps4/ReceiverErrorMapper.kt
          grep -q '0x80991502' app/src/main/java/com/tayson/ps4linksender/ps4/ReceiverErrorMapper.kt
          grep -q '0x8095F00C' app/src/main/java/com/tayson/ps4linksender/ps4/ReceiverErrorMapper.kt
          grep -q '0x80431076' app/src/main/java/com/tayson/ps4linksender/ps4/ReceiverErrorMapper.kt
          grep -q '0x80020008' app/src/main/java/com/tayson/ps4linksender/ps4/ReceiverErrorMapper.kt
          grep -q 'HTTP 403' app/src/main/java/com/tayson/ps4linksender/ps4/ReceiverErrorMapper.kt

      - name: Lint and build universal APK 1.0.1
        shell: bash
        run: |
          set -o pipefail
          cd /tmp/TaysonPS4LinkSender-1.0.1
          gradle --no-daemon :app:lintUniversalDebug :app:assembleUniversalDebug 2>&1 | tee android-build-1.0.1.log
          test -s app/build/outputs/apk/universal/debug/app-universal-debug.apk

      - name: Prepare Link Sender 1.0.1 artifacts
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/TaysonPS4LinkSender-1.0.1
          mkdir -p dist
          cp app/build/outputs/apk/universal/debug/app-universal-debug.apk \
            dist/Tayson-PS4-Link-Sender-1.0.1-universal-debug.apk
          cp android-build-1.0.1.log dist/
          tar -czf dist/TaysonPS4LinkSender-1.0.1-source.tar.gz \
            --exclude='./dist' --exclude='./app/build' --exclude='./.gradle' .
          (
            cd dist
            sha256sum \
              Tayson-PS4-Link-Sender-1.0.1-universal-debug.apk \
              TaysonPS4LinkSender-1.0.1-source.tar.gz > SHA256SUMS.txt
          )

      - name: Upload Link Sender 1.0.1
        uses: actions/upload-artifact@v4
        with:
          name: Tayson-PS4-Link-Sender-1.0.1
          path: /tmp/TaysonPS4LinkSender-1.0.1/dist/*
          if-no-files-found: error
          retention-days: 30
