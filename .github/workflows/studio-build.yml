name: Build Tayson PS4 Studio (test APK)

on:
  workflow_dispatch:
  push:
    branches: [feat/tayson-ps4-studio]
    paths:
      - '.github/workflows/studio-build.yml'
      - 'scripts/**'
      - 'studio-tests/**'
      - 'payload-generator/3.2.0/UPDATE/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq liblz4-1
      - name: Fetch and verify inherited runtime base
        run: python3 scripts/fetch-runtime-base.py /tmp/studio-base.apk
      - name: Build independent Studio APK
        run: python3 scripts/build-studio.py --base-apk /tmp/studio-base.apk --tools /tmp/studio-tools --output out
      - name: Upload test APK and validation logs
        uses: actions/upload-artifact@v4
        with:
          name: Tayson-PS4-Studio-1.0.0-test
          if-no-files-found: error
          path: |
            out/Tayson-PS4-Studio-1.0.0.apk
            out/build-info.json
            out/SHA256SUMS.txt
            out/*.log
