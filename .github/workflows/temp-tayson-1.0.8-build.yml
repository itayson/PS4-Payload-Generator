name: Temporary Tayson PS4 Receiver 1.0.8 Build

on:
  push:
    branches:
      - build/tayson-ps4-suite-1.0.8

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Restore validated Receiver 1.0.7 source artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          curl -fL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o /tmp/receiver107.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10276296327/zip"
          rm -rf /tmp/receiver107 /tmp/TaysonPS4Suite-1.0.8
          mkdir -p /tmp/receiver107 /tmp/TaysonPS4Suite-1.0.8
          unzip -q /tmp/receiver107.zip -d /tmp/receiver107
          test -s /tmp/receiver107/TaysonPS4Suite-1.0.7-source.tar.gz
          tar -xzf /tmp/receiver107/TaysonPS4Suite-1.0.7-source.tar.gz \
            -C /tmp/TaysonPS4Suite-1.0.8 --strip-components=1
          test -f /tmp/TaysonPS4Suite-1.0.8/ps4receiver/receiver/main.c
          test -s /tmp/TaysonPS4Suite-1.0.8/ps4receiver/third_party/jbc.o

      - name: Apply 1.0.8 proxy worker stack patch
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/TaysonPS4Suite-1.0.8
          python3 "$GITHUB_WORKSPACE/ci108/patch_receiver_108.py"
          grep -q 'RECEIVER_VERSION "1.0.8"' ps4receiver/receiver/main.c
          grep -q 'VERSION     := 1.08' ps4receiver/Makefile
          grep -q 'PROXY_WORKER_STACK_SIZE (1024 \* 1024)' ps4receiver/receiver/main.c
          grep -q 'pthread_attr_setstacksize(&worker_attr, PROXY_WORKER_STACK_SIZE)' ps4receiver/receiver/main.c
          grep -q 'receiver_https_accept_callback' ps4receiver/receiver/main.c

      - name: Install OpenOrbis PS4 Toolchain 0.5.4
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v ld.lld >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y lld
          fi
          curl -fL --retry 3 --retry-delay 3 \
            -o /tmp/openorbis-toolchain.tar.gz \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz
          echo '3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  /tmp/openorbis-toolchain.tar.gz' | sha256sum -c -
          rm -rf /tmp/openorbis
          mkdir -p /tmp/openorbis
          tar -xzf /tmp/openorbis-toolchain.tar.gz -C /tmp/openorbis
          LINKX="$(find /tmp/openorbis -type f -name link.x -print -quit)"
          test -n "$LINKX"
          TOOLROOT="$(dirname "$LINKX")"
          echo "OO_PS4_TOOLCHAIN=$TOOLROOT" >> "$GITHUB_ENV"
          test -x "$TOOLROOT/bin/linux/create-fself"
          test -x "$TOOLROOT/bin/linux/PkgTool.Core"
          test -x "$TOOLROOT/bin/linux/create-gp4"

      - name: Refresh OpenOrbis runtime modules
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/TaysonPS4Suite-1.0.8
          mkdir -p ps4receiver/sce_module ps4receiver/sce_sys/about
          for module in libc.prx libSceFios2.prx; do
            src="$(find "$OO_PS4_TOOLCHAIN" -type f -name "$module" -print -quit)"
            test -n "$src"
            cp "$src" "ps4receiver/sce_module/$module"
          done
          right="$(find "$OO_PS4_TOOLCHAIN" -type f -name right.sprx -print -quit || true)"
          if [ -n "$right" ]; then cp "$right" ps4receiver/sce_sys/about/right.sprx; fi
          test -s ps4receiver/sce_module/libc.prx
          test -s ps4receiver/sce_module/libSceFios2.prx

      - name: Build and validate Receiver 1.0.8
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/TaysonPS4Suite-1.0.8
          make -C ps4receiver clean pkg.gp4 2>&1 | tee receiver-build-1.0.8.log
          test -s ps4receiver/eboot.bin
          test -s ps4receiver/build/receiver.elf
          readelf -d ps4receiver/build/receiver.elf | tee receiver-needed-1.0.8.txt
          nm ps4receiver/build/receiver.elf | grep -q ' jbc_get_cred$'
          nm ps4receiver/build/receiver.elf | grep -q ' jbc_jailbreak_cred$'
          nm ps4receiver/build/receiver.elf | grep -q ' jbc_set_cred$'
          ! grep -q 'libSceBgft.so' receiver-needed-1.0.8.txt
          ! grep -q 'libSceAppInstUtil.so' receiver-needed-1.0.8.txt
          docker run --rm \
            -v /tmp/openorbis/OpenOrbis/PS4Toolchain:/oo:ro \
            -v /tmp/TaysonPS4Suite-1.0.8/ps4receiver:/work \
            -w /work ubuntu:20.04 \
            bash -lc 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libssl1.1 libicu66 zlib1g libcurl4 ca-certificates >/dev/null && /oo/bin/linux/PkgTool.Core pkg_build pkg.gp4 .'
          test -s ps4receiver/IV0000-TYRC00001_00-TAYSONRECEIVER00.pkg

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/TaysonPS4Suite-1.0.8
          mkdir -p dist
          cp ps4receiver/IV0000-TYRC00001_00-TAYSONRECEIVER00.pkg dist/Tayson-PS4-Receiver-1.0.8.pkg
          cp ps4receiver/eboot.bin dist/Tayson-PS4-Receiver-1.0.8-eboot.bin
          cp receiver-build-1.0.8.log receiver-needed-1.0.8.txt dist/
          tar -czf dist/TaysonPS4Suite-1.0.8-source.tar.gz \
            --exclude='./dist' --exclude='./app/build' --exclude='./.gradle' .
          (
            cd dist
            sha256sum Tayson-PS4-Receiver-1.0.8.pkg \
              Tayson-PS4-Receiver-1.0.8-eboot.bin \
              TaysonPS4Suite-1.0.8-source.tar.gz > SHA256SUMS.txt
          )

      - name: Upload Receiver 1.0.8
        uses: actions/upload-artifact@v4
        with:
          name: Tayson-PS4-Receiver-1.0.8
          path: /tmp/TaysonPS4Suite-1.0.8/dist/*
          if-no-files-found: error
          retention-days: 30
