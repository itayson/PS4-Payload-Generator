name: Build Akirabox APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android 7+ / ARM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate payload protocol
        run: bash ./scripts/test-core.sh

      - name: Lint and build installable APKs
        run: >-
          gradle --no-daemon
          :app:lintArmv7Debug
          :app:lintArm64Debug
          :app:lintUniversalDebug
          :app:assembleArmv7Debug
          :app:assembleArm64Debug
          :app:assembleUniversalDebug

      - name: Prepare downloads
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/armv7/debug/app-armv7-debug.apk dist/Akirabox-Android7-armeabi-v7a.apk
          cp app/build/outputs/apk/arm64/debug/app-arm64-debug.apk dist/Akirabox-Android7-arm64-v8a.apk
          cp app/build/outputs/apk/universal/debug/app-universal-debug.apk dist/Akirabox-Android7-universal.apk
          cd dist
          sha256sum *.apk > SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Akirabox-Android-APKs
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach APKs to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
