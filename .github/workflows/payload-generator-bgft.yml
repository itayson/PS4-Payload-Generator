name: Tayson PS4 Payload Generator 3.4.5 BGFT diagnostic

on:
  push:
    branches:
      - main
      - feature/payload-generator-bgft-universal
      - feature/neon-ui-redesign
      - feature/3.4.0-paste-metadata-icon
      - feature/3.4.1-unified-provider-routes
      - feature/3.4.2-filek-provider-context
      - feature/3.4.3-filek-dlproxy
      - hotfix/3.4.4-mocha-direct-bgft
      - diagnostic/3.4.5-bgft-stages
  pull_request:
    branches:
      - main
      - feature/payload-generator-bgft-universal
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq liblz4-1 unzip curl git yasm build-essential

      - name: Download verified Phoenixx V3 base APK
        shell: bash
        run: |
          set -euxo pipefail
          PAGE='https://www.mediafire.com/file/hi4h13wzunr2bjm/phoenixx.ps4remotepkg_v3.0%2B%282%29.apk/file'
          curl -fL --retry 3 -A 'Mozilla/5.0' "$PAGE" -o /tmp/mediafire.html
          python3 - <<'PY' >/tmp/direct-url.txt
          import html, re
          text=open('/tmp/mediafire.html',encoding='utf-8',errors='ignore').read()
          patterns=[
              r'id=["\']downloadButton["\'][^>]*href=["\']([^"\']+)',
              r'href=["\']([^"\']+)["\'][^>]*id=["\']downloadButton["\']'
          ]
          for pattern in patterns:
              m=re.search(pattern,text,re.I)
              if m:
                  print(html.unescape(m.group(1)))
                  break
          else:
              raise SystemExit('MediaFire direct download link not found')
          PY
          DIRECT="$(cat /tmp/direct-url.txt)"
          test -n "$DIRECT"
          curl -fL --retry 3 -A 'Mozilla/5.0' "$DIRECT" -o /tmp/original.apk
          echo 'a441a8321edba13ebd2597863477c409004e7d4475b9221951bf2991e2feee81  /tmp/original.apk' | sha256sum -c -

      - name: Reconstruct build tree
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/payloadgen /tmp/tools /tmp/out
          mkdir -p /tmp/payloadgen /tmp/out
          unzip -q /tmp/original.apk -d /tmp/payloadgen
          mkdir -p /tmp/payloadgen/UPDATE/base
          cp /tmp/payloadgen/assets/template.elf /tmp/payloadgen/UPDATE/base/original-template.elf
          cp /tmp/payloadgen/assemblies/assemblies.blob /tmp/payloadgen/UPDATE/base/original-assemblies.blob
          cp /tmp/payloadgen/AndroidManifest.xml /tmp/payloadgen/UPDATE/base/original-AndroidManifest.xml
          cp -a payload-generator/3.2.0/UPDATE/. /tmp/payloadgen/UPDATE/
          python3 /tmp/payloadgen/UPDATE/scripts/patch_diagnostics.py
          sha256sum /tmp/payloadgen/UPDATE/base/original-template.elf /tmp/payloadgen/assets/template.elf

      - name: Prepare compiler and Android build tools
        run: |
          python3 /tmp/payloadgen/UPDATE/scripts/prepare.py --base /tmp/payloadgen --tools /tmp/tools



      - name: Map inherited 3.4.3 BGFT contract
        if: github.ref == 'refs/heads/diagnostic/3.4.5-bgft-stages'
        shell: bash
        run: |
          set -euxo pipefail
          ELF=/tmp/payloadgen/UPDATE/base/original-template.elf
          file "$ELF"
          echo '--- inherited BGFT/User/AppInst symbols and strings ---'
          strings -a -t x "$ELF" | grep -Eai 'SceBgft|Bgft|UserService|AppInst|SystemService|GetInitialUser|Initialize|RegisterPkg|StartTask|user_id|task_id|package_size|content_url' || true
          echo '--- inherited main disassembly ---'
          objdump -d -Mintel "$ELF" | sed -n '/<main>:/,/^$/p' || true
          echo '--- inherited setup_jbc disassembly ---'
          objdump -d -Mintel "$ELF" | sed -n '/<setup_jbc>:/,/^$/p' || true
          echo '--- inherited notify_error disassembly ---'
          objdump -d -Mintel "$ELF" | sed -n '/<notify_error>:/,/^$/p' || true
          echo '--- inherited DWARF names ---'
          readelf --debug-dump=info "$ELF" | grep -Eai -B2 -A6 'SceBgft|Bgft|UserService|AppInst|GetInitialUser|user_id|task_id|content_url|package_size' | head -n 500 || true

      - name: Build BGFT stage diagnostic ELF
        if: github.ref == 'refs/heads/diagnostic/3.4.5-bgft-stages'
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/dpi
          git clone https://github.com/marcussacana/DirectPackageInstaller.git /tmp/dpi
          cd /tmp/dpi
          git checkout ca7bade66737fede3b0e7bad73b665e0a4d4ff39
          cd Payload
          make -C lib clean
          make -C lib lib.a
          cp "$GITHUB_WORKSPACE/payload-generator/3.2.0/UPDATE/diagnostic/bgft_stage_diag.c" ./bgft_stage_diag.c
          gcc -g -mcmodel=small -isystem freebsd-headers -nostdinc -nostdlib \
            -fno-stack-protector -static lib/lib.a bgft_stage_diag.c ps4-libjbc/*.c \
            -Wl,-gc-sections -o /tmp/bgft-stage-diag.elf -fPIE -ffreestanding
          file /tmp/bgft-stage-diag.elf
          cp /tmp/bgft-stage-diag.elf /tmp/payloadgen/assets/template.elf
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/payloadgen/assets/template.elf').read_bytes()
          assert p[:4] == b'\x7fELF'
          for marker,width in [
              (b'###CONTENT_ID_PLACEHOLDER###',64),
              (b'###URL_PLACEHOLDER###',2048),
              (b'###NAME_PLACEHOLDER###',128),
              (b'###TYPE###',16),
          ]:
              needle=marker+b'\0'*(width-len(marker))
              assert p.count(needle)==1, (marker,p.count(needle))
          assert p.count(b'\xbb'*8)==1
          print('Diagnostic ELF markers verified:', len(p))
          PY

      - name: Inspect native ELF diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          ELF=/tmp/payloadgen/assets/template.elf
          file "$ELF"
          readelf -h "$ELF" || true
          echo '--- interesting strings ---'
          strings -a -t x "$ELF" | grep -Eai 'registro|bgft|download|task|erro|error|start|payload|sucesso|falha|dev\. by|http' || true
          echo '--- placeholders ---'
          strings -a -t x "$ELF" | grep -Ea 'URL_PLACEHOLDER|CONTENT_ID_PLACEHOLDER|NAME_PLACEHOLDER|###TYPE###' || true
          echo '--- native symbols ---'
          nm -n "$ELF" | grep -Eai 'main|bgft|notify|download|register|start|error|task' || true
          echo '--- main disassembly ---'
          objdump -d -Mintel "$ELF" | sed -n '/<main>:/,/^$/p' || true
          echo '--- notify_error disassembly ---'
          objdump -d -Mintel "$ELF" | sed -n '/<notify_error>:/,/^$/p' || true
          echo '--- bgft source lines ---'
          readelf --debug-dump=decodedline "$ELF" | grep -Eai 'main.c|bgft|download|register|notify' | head -n 240 || true

      - name: Validate Worker v11.2
        shell: bash
        run: |
          set -euxo pipefail
          node --check /tmp/payloadgen/UPDATE/cloudflare/universal_transport_worker_v11_2.js
          grep -q '/api/mocha-routes' /tmp/payloadgen/UPDATE/cloudflare/universal_transport_worker_v11_2.js
          grep -q '/api/filek-routes' /tmp/payloadgen/UPDATE/cloudflare/universal_transport_worker_v11_2.js
          grep -q '/api/viking-routes' /tmp/payloadgen/UPDATE/cloudflare/universal_transport_worker_v11_2.js

      - name: Run core tests
        shell: bash
        run: |
          set -euxo pipefail
          /tmp/tools/dotnet/dotnet run --project /tmp/payloadgen/UPDATE/tests/Tests.csproj -- /tmp/payloadgen/assets/template.elf | tee /tmp/out/tests.log
          grep -q 'RESULT: 104 checks passed' /tmp/out/tests.log

      - name: Build Tayson 3.4.5 DIAG
        shell: bash
        run: |
          set -euxo pipefail
          python3 /tmp/payloadgen/UPDATE/scripts/build.py --base /tmp/payloadgen --tools /tmp/tools --output /tmp/out | tee /tmp/out/build.log
          test -s /tmp/payloadgen/UPDATE/build/aligned.apk

          python3 /tmp/payloadgen/UPDATE/scripts/apply_release_identity.py \
            --apk /tmp/payloadgen/UPDATE/build/aligned.apk \
            --icon-source /tmp/payloadgen/UPDATE/assets/tayson-launcher.jpg \
            --output /tmp/out/PS4-Payload-Generator-3.4.5-DIAG-TaySon.apk \
            --unsigned-output /tmp/out/PS4-Payload-Generator-3.4.5-DIAG-aligned-unsigned.apk \
            --tools /tmp/tools \
            --keystore /tmp/payloadgen/UPDATE/signing/tayson-test.jks \
            --build-info /tmp/out/build-info.json

          test -s /tmp/out/PS4-Payload-Generator-3.4.5-DIAG-TaySon.apk
          test -s /tmp/out/PS4-Payload-Generator-3.4.5-DIAG-aligned-unsigned.apk
          /tmp/tools/android/android-15/aapt dump badging /tmp/out/PS4-Payload-Generator-3.4.5-DIAG-TaySon.apk | grep -q "package: name='com.tayson.ps4payloadgenerator'"

          cp /tmp/tools/android/android-15/lib/apksigner.jar /tmp/out/apksigner.jar
          cp /tmp/payloadgen/UPDATE/cloudflare/universal_transport_worker_v8.js /tmp/out/
          cp /tmp/payloadgen/UPDATE/cloudflare/universal_transport_worker_v11_2.js /tmp/out/
          cp payload-generator/3.2.0/README.md /tmp/out/README-3.4.5-DIAG.md
          cp payload-generator/3.2.0/VALIDATION.md /tmp/out/VALIDATION-3.4.5-DIAG.md
          sha256sum /tmp/out/PS4-Payload-Generator-3.4.5-DIAG-TaySon.apk /tmp/out/PS4-Payload-Generator-3.4.5-DIAG-aligned-unsigned.apk > /tmp/out/SHA256SUMS.txt
          cat /tmp/out/build-info.json

      - name: Publish 3.4.3 FileKeeper dlproxy prerelease
        if: github.ref == 'refs/heads/feature/3.4.3-filek-dlproxy'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG='v3.4.3-filek-dlproxy-test'
          gh release delete "$TAG" --cleanup-tag -y || true
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title 'Tayson 3.4.3 — FileKeeper dlproxy route fix' \
            --notes 'Candidato de teste físico para CE-32942-0. Preserva a identidade FileKeeper após a resolução da URL e força rota Worker terminada em .pkg; usa Worker v11.2.' \
            --prerelease
          gh release upload "$TAG" \
            /tmp/out/PS4-Payload-Generator-3.4.5-DIAG-TaySon.apk \
            /tmp/out/universal_transport_worker_v11_2.js \
            /tmp/out/SHA256SUMS.txt \
            --clobber

      - name: Publish stable v3.4.3 release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG='v3.4.3'
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Stable release $TAG already exists; leaving validated assets unchanged."
            exit 0
          fi
          cat > /tmp/out/RELEASE-NOTES.md <<'EOF'
          # Tayson PS4 Payload Generator 3.4.3

          Release estável validada em PS4 real.

          - aplicativo 3.4.3 / versionCode 40;
          - Worker v11.2;
          - Mocha via `/m/<token>.pkg`;
          - FileKeeper via `/f/<token>.pkg`, incluindo `dlproxy.uk`;
          - VikingFile via `/v/<token>.pkg`;
          - Rootz/R2 via `/d/<token>.pkg`;
          - AkiraBox via `/a/<token>.pkg`;
          - binding: `ROUTES -> tayson-payload-routes`;
          - 103 checks aprovados;
          - template ELF preservado:
            `ec778c6b39835e6d9ee8681faf99e827b18da0148b8d8e75f0c9d85925f4b1bc`.

          Uso destinado a desenvolvimento, homebrew, testes e gerenciamento de conteúdo autorizado.
          EOF
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title 'Tayson PS4 Payload Generator 3.4.3' \
            --notes-file /tmp/out/RELEASE-NOTES.md \
            --latest \
            /tmp/out/PS4-Payload-Generator-3.4.5-DIAG-TaySon.apk \
            /tmp/out/universal_transport_worker_v11_2.js \
            /tmp/out/SHA256SUMS.txt
          sha256sum /tmp/out/PS4-Payload-Generator-3.4.5-DIAG-TaySon.apk

      - name: Publish 3.4.4 Mocha direct test release
        if: github.ref == 'refs/heads/hotfix/3.4.4-mocha-direct-bgft'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG='v3.4.4-mocha-direct-test'
          gh release delete "$TAG" --cleanup-tag -y || true
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title 'Tayson 3.4.4 — Mocha direct transport hotfix' \
            --notes 'Teste físico: restaura o transporte direto para URLs assinadas Mocha. Nenhum token ou URL de usuário é incluído nesta release.' \
            --prerelease
          gh release upload "$TAG" \
            /tmp/out/PS4-Payload-Generator-3.4.5-DIAG-TaySon.apk \
            /tmp/out/SHA256SUMS.txt \
            --clobber


      - name: Publish 3.4.5 BGFT diagnostic test release
        if: github.ref == 'refs/heads/diagnostic/3.4.5-bgft-stages'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG='v3.4.5-bgft-diagnostic-test'
          gh release delete "$TAG" --cleanup-tag -y || true
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title 'Tayson 3.4.5 — BGFT diagnostic' \
            --notes 'Build temporária de diagnóstico. Exibe apenas estágios e códigos BGFT; não registra URLs, tokens, cookies ou IPs.' \
            --prerelease
          gh release upload "$TAG" \
            /tmp/out/PS4-Payload-Generator-3.4.5-DIAG-TaySon.apk \
            /tmp/out/SHA256SUMS.txt \
            --clobber
