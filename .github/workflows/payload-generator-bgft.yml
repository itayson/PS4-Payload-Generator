name: Tayson PS4 Payload Generator 3.5.0 — 0e6b baseline

on:
  push:
    branches:
      - main
      - feature/payload-generator-bgft-universal
      - feature/neon-ui-redesign
      - feature/3.4.0-paste-metadata-icon
      - feature/3.5.0-rebuild-from-0e6b897
  pull_request:
    branches:
      - main
      - feature/payload-generator-bgft-universal
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify exact known-good application source
        shell: bash
        run: |
          set -euxo pipefail
          BASE=b58ece326bb87d4fbb7535d03a3c48d7dac1dc95
          git diff --exit-code "$BASE" -- payload-generator/3.2.0/UPDATE
          test "$(git rev-parse "$BASE:payload-generator/3.2.0/UPDATE/scripts/patch_diagnostics.py")" =                "$(git rev-parse HEAD:payload-generator/3.2.0/UPDATE/scripts/patch_diagnostics.py)"

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq liblz4-1 unzip curl

      - name: Download verified Phoenixx V3 base APK
        shell: bash
        run: |
          set -euxo pipefail
          PAGE='https://www.mediafire.com/file/hi4h13wzunr2bjm/phoenixx.ps4remotepkg_v3.0%2B%282%29.apk/file'
          curl -fL --retry 3 -A 'Mozilla/5.0' "$PAGE" -o /tmp/mediafire.html
          python3 - <<'PY' >/tmp/direct-url.txt
          import html, re
          text=open('/tmp/mediafire.html',encoding='utf-8',errors='ignore').read()
          patterns=[
              r'id=["\']downloadButton["\'][^>]*href=["\']([^"\']+)',
              r'href=["\']([^"\']+)["\'][^>]*id=["\']downloadButton["\']'
          ]
          for pattern in patterns:
              m=re.search(pattern,text,re.I)
              if m:
                  print(html.unescape(m.group(1)))
                  break
          else:
              raise SystemExit('MediaFire direct download link not found')
          PY
          DIRECT="$(cat /tmp/direct-url.txt)"
          test -n "$DIRECT"
          curl -fL --retry 3 -A 'Mozilla/5.0' "$DIRECT" -o /tmp/original.apk
          echo 'a441a8321edba13ebd2597863477c409004e7d4475b9221951bf2991e2feee81  /tmp/original.apk' | sha256sum -c -

      - name: Reconstruct build tree
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/payloadgen /tmp/tools /tmp/out
          mkdir -p /tmp/payloadgen /tmp/out
          unzip -q /tmp/original.apk -d /tmp/payloadgen
          mkdir -p /tmp/payloadgen/UPDATE/base
          cp /tmp/payloadgen/assets/template.elf /tmp/payloadgen/UPDATE/base/original-template.elf
          cp /tmp/payloadgen/assemblies/assemblies.blob /tmp/payloadgen/UPDATE/base/original-assemblies.blob
          cp /tmp/payloadgen/AndroidManifest.xml /tmp/payloadgen/UPDATE/base/original-AndroidManifest.xml
          cp -a payload-generator/3.2.0/UPDATE/. /tmp/payloadgen/UPDATE/

          # Runtime/app source remains exactly the CI #197 baseline. Only the
          # Android release identity is raised in this temporary build tree.
          sed -i "s/APP_VERSION = '3.4.0'/APP_VERSION = '3.5.0'/" /tmp/payloadgen/UPDATE/scripts/build.py
          sed -i "s/APP_VERSION_CODE = 37/APP_VERSION_CODE = 38/" /tmp/payloadgen/UPDATE/scripts/build.py
          sed -i "s/PS4-Payload-Generator-3.5.0-TaySon.apk/PS4-Payload-Generator-3.5.0-TaySon.apk/g" /tmp/payloadgen/UPDATE/scripts/build.py

          python3 /tmp/payloadgen/UPDATE/scripts/patch_diagnostics.py
          sha256sum /tmp/payloadgen/UPDATE/base/original-template.elf /tmp/payloadgen/assets/template.elf
          echo 'ec778c6b39835e6d9ee8681faf99e827b18da0148b8d8e75f0c9d85925f4b1bc  /tmp/payloadgen/assets/template.elf' | sha256sum -c -

      - name: Prepare compiler and Android build tools
        run: |
          python3 /tmp/payloadgen/UPDATE/scripts/prepare.py --base /tmp/payloadgen --tools /tmp/tools

      - name: Run core tests
        shell: bash
        run: |
          set -euxo pipefail
          /tmp/tools/dotnet/dotnet run --project /tmp/payloadgen/UPDATE/tests/Tests.csproj -- /tmp/payloadgen/assets/template.elf | tee /tmp/out/tests.log
          grep -q 'RESULT: 89 checks passed' /tmp/out/tests.log

      - name: Build Tayson 3.5.0 from 0e6b baseline
        shell: bash
        run: |
          set -euxo pipefail
          python3 /tmp/payloadgen/UPDATE/scripts/build.py --base /tmp/payloadgen --tools /tmp/tools --output /tmp/out | tee /tmp/out/build.log
          test -s /tmp/payloadgen/UPDATE/build/aligned.apk

          python3 /tmp/payloadgen/UPDATE/scripts/apply_release_identity.py \
            --apk /tmp/payloadgen/UPDATE/build/aligned.apk \
            --icon-source /tmp/payloadgen/UPDATE/assets/tayson-launcher.jpg \
            --output /tmp/out/PS4-Payload-Generator-3.5.0-TaySon.apk \
            --unsigned-output /tmp/out/PS4-Payload-Generator-3.5.0-aligned-unsigned.apk \
            --tools /tmp/tools \
            --keystore /tmp/payloadgen/UPDATE/signing/tayson-test.jks \
            --build-info /tmp/out/build-info.json

          test -s /tmp/out/PS4-Payload-Generator-3.5.0-TaySon.apk
          test -s /tmp/out/PS4-Payload-Generator-3.5.0-aligned-unsigned.apk
          /tmp/tools/android/android-15/aapt dump badging /tmp/out/PS4-Payload-Generator-3.5.0-TaySon.apk | grep -q "package: name='com.tayson.ps4payloadgenerator'"
          /tmp/tools/android/android-15/aapt dump badging /tmp/out/PS4-Payload-Generator-3.5.0-TaySon.apk | grep -q "versionCode='38' versionName='3.5.0'"

          cp /tmp/tools/android/android-15/lib/apksigner.jar /tmp/out/apksigner.jar
          cp /tmp/payloadgen/UPDATE/cloudflare/universal_transport_worker_v8.js /tmp/out/
          cp payload-generator/3.2.0/README.md /tmp/out/README-0e6b-baseline.md
          cp payload-generator/3.2.0/VALIDATION.md /tmp/out/VALIDATION-0e6b-baseline.md
          sha256sum /tmp/out/PS4-Payload-Generator-3.5.0-TaySon.apk /tmp/out/PS4-Payload-Generator-3.5.0-aligned-unsigned.apk > /tmp/out/SHA256SUMS.txt
          cat /tmp/out/build-info.json

      - name: Create exact-binary 0e6b baseline candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p /tmp/known-good-197
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/itayson/PS4-Payload-Generator/actions/artifacts/10522047295/zip \
            -o /tmp/known-good-197.zip
          unzip -q /tmp/known-good-197.zip -d /tmp/known-good-197

          BASE=/tmp/known-good-197/PS4-Payload-Generator-3.4.0-TaySon.apk
          echo '0e6b897b1f9cd60bc71f44e9eca6dd81ee721e39311f26e112c95b65c9e60ffe  '${BASE} | sha256sum -c -

          python3 - "$BASE" /tmp/out/0e6b-version-patched-unaligned.apk <<'PY'
          import struct, sys, zipfile
          from pathlib import Path

          source = Path(sys.argv[1])
          target = Path(sys.argv[2])

          def patch_manifest(blob):
              data = bytearray(blob)
              pos = 8
              chunks = []
              while pos < len(data):
                  typ, header, size = struct.unpack_from('<HHI', data, pos)
                  chunks.append((pos, typ, header, size))
                  pos += size

              pool_pos, _, _, pool_size = next(x for x in chunks if x[1] == 1)
              pool = data[pool_pos:pool_pos + pool_size]
              count, styles, flags, start, style_start = struct.unpack_from('<5I', pool, 8)
              if flags & 0x100:
                  raise SystemExit('Unexpected UTF-8 AndroidManifest string pool')

              strings = []
              string_positions = []
              for i in range(count):
                  off = struct.unpack_from('<I', pool, 28 + 4 * i)[0]
                  p = start + off
                  units = struct.unpack_from('<H', pool, p)[0]
                  p += 2
                  if units & 0x8000:
                      units = ((units & 0x7fff) << 16) | struct.unpack_from('<H', pool, p)[0]
                      p += 2
                  raw_start = pool_pos + p
                  text = data[raw_start:raw_start + units * 2].decode('utf-16-le')
                  strings.append(text)
                  string_positions.append((raw_start, units))

              try:
                  version_index = strings.index('3.4.0')
              except ValueError:
                  raise SystemExit('Known-good manifest no longer contains versionName 3.4.0')

              raw_start, units = string_positions[version_index]
              replacement = '3.5.0'.encode('utf-16-le')
              if len(replacement) != units * 2:
                  raise SystemExit('Version replacement must remain fixed-width')
              data[raw_start:raw_start + len(replacement)] = replacement

              map_pos, _, _, map_size = next(x for x in chunks if x[1] == 0x180)
              ids = list(struct.unpack_from(
                  '<' + 'I' * ((map_size - 8) // 4), data, map_pos + 8))

              manifest_found = False
              for chunk_pos, typ, header, size in chunks:
                  if typ != 0x102:
                      continue
                  name_index = struct.unpack_from('<I', data, chunk_pos + 20)[0]
                  if strings[name_index] != 'manifest':
                      continue
                  manifest_found = True
                  attr_start, attr_size, attr_count = struct.unpack_from('<HHH', data, chunk_pos + 24)
                  first = chunk_pos + 16 + attr_start
                  for i in range(attr_count):
                      attr = first + i * attr_size
                      name_idx = struct.unpack_from('<I', data, attr + 4)[0]
                      rid = ids[name_idx] if name_idx < len(ids) else 0
                      if rid == 0x0101021b:  # android:versionCode
                          dtype = data[attr + 15]
                          if dtype != 0x10:
                              raise SystemExit('Unexpected versionCode value type')
                          old_code = struct.unpack_from('<I', data, attr + 16)[0]
                          if old_code != 37:
                              raise SystemExit(f'Expected versionCode 37, got {old_code}')
                          struct.pack_into('<I', data, attr + 16, 38)
                  break

              if not manifest_found:
                  raise SystemExit('Manifest start element not found')
              return bytes(data)

          def is_signature(name):
              upper = name.upper()
              if upper == 'META-INF/MANIFEST.MF':
                  return True
              return upper.startswith('META-INF/') and upper.endswith(('.SF', '.RSA', '.DSA', '.EC'))

          with zipfile.ZipFile(source, 'r') as zin, zipfile.ZipFile(target, 'w') as zout:
              for info in zin.infolist():
                  if is_signature(info.filename):
                      continue
                  payload = zin.read(info.filename)
                  if info.filename == 'AndroidManifest.xml':
                      payload = patch_manifest(payload)
                  zout.writestr(info, payload)

          print(target)
          PY

          ZIPALIGN=/tmp/tools/android/android-15/zipalign
          APKSIGNER=/tmp/tools/android/android-15/lib/apksigner.jar
          "$ZIPALIGN" -f 4 /tmp/out/0e6b-version-patched-unaligned.apk /tmp/out/0e6b-version-patched-aligned.apk

          KEY=/tmp/out/tayson-0e6b-rebuild.jks
          keytool -genkeypair -noprompt \
            -keystore "$KEY" -storepass android -keypass android \
            -alias tayson-test -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=TaySon PS4 Payload Generator'

          java -jar "$APKSIGNER" sign \
            --ks "$KEY" --ks-key-alias tayson-test \
            --ks-pass pass:android --key-pass pass:android \
            --out /tmp/out/PS4-Payload-Generator-3.5.0-EXACT-0e6b.apk \
            /tmp/out/0e6b-version-patched-aligned.apk

          java -jar "$APKSIGNER" verify --verbose /tmp/out/PS4-Payload-Generator-3.5.0-EXACT-0e6b.apk
          /tmp/tools/android/android-15/aapt dump badging /tmp/out/PS4-Payload-Generator-3.5.0-EXACT-0e6b.apk \
            | grep -q "package: name='com.tayson.ps4payloadgenerator' versionCode='38' versionName='3.5.0'"

          python3 - "$BASE" /tmp/out/PS4-Payload-Generator-3.5.0-EXACT-0e6b.apk <<'PY'
          import hashlib, sys, zipfile

          base, rebuilt = sys.argv[1], sys.argv[2]

          def ignored(name):
              upper = name.upper()
              return (
                  name == 'AndroidManifest.xml' or
                  upper == 'META-INF/MANIFEST.MF' or
                  (upper.startswith('META-INF/') and upper.endswith(('.SF', '.RSA', '.DSA', '.EC')))
              )

          with zipfile.ZipFile(base) as a, zipfile.ZipFile(rebuilt) as b:
              names_a = {n for n in a.namelist() if not ignored(n)}
              names_b = {n for n in b.namelist() if not ignored(n)}
              if names_a != names_b:
                  raise SystemExit('Non-signature APK entry list changed')

              changed = []
              for name in sorted(names_a):
                  ha = hashlib.sha256(a.read(name)).hexdigest()
                  hb = hashlib.sha256(b.read(name)).hexdigest()
                  if ha != hb:
                      changed.append(name)

              if changed:
                  raise SystemExit('Unexpected binary differences: ' + ', '.join(changed))

              print('Exact baseline content verified:', len(names_a), 'entries unchanged')
              for name in ('assemblies/assemblies.blob', 'classes.dex', 'classes2.dex', 'assets/template.elf'):
                  print(name, hashlib.sha256(a.read(name)).hexdigest())
          PY

          sha256sum /tmp/out/PS4-Payload-Generator-3.5.0-EXACT-0e6b.apk \
            > /tmp/out/SHA256-EXACT-0e6b.txt

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Tayson-PS4-Payload-Generator-3.5.0-from-0e6b897
          path: /tmp/out/*
          if-no-files-found: error
          retention-days: 30
