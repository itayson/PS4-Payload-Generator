name: Tayson PS4 Payload Generator 3.5.3 BGFT Cover / Worker v12

on:
  push:
    branches:
      - main
      - feature/payload-generator-bgft-universal
      - feature/neon-ui-redesign
      - feature/3.4.0-paste-metadata-icon
      - feature/3.4.1-unified-provider-routes
      - feature/3.4.2-filek-provider-context
      - feature/3.4.3-filek-dlproxy
      - feature/3.5.0-mega-bgft-worker-v12
      - feature/3.5.3-bgft-cover
  pull_request:
    branches:
      - main
      - feature/payload-generator-bgft-universal
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq liblz4-1 unzip curl git yasm build-essential

      - name: Download verified Phoenixx V3 base APK
        shell: bash
        run: |
          set -euxo pipefail
          PAGE='https://www.mediafire.com/file/hi4h13wzunr2bjm/phoenixx.ps4remotepkg_v3.0%2B%282%29.apk/file'
          curl -fL --retry 3 -A 'Mozilla/5.0' "$PAGE" -o /tmp/mediafire.html
          python3 - <<'PY' >/tmp/direct-url.txt
          import html, re
          text=open('/tmp/mediafire.html',encoding='utf-8',errors='ignore').read()
          patterns=[
              r'id=["\']downloadButton["\'][^>]*href=["\']([^"\']+)',
              r'href=["\']([^"\']+)["\'][^>]*id=["\']downloadButton["\']'
          ]
          for pattern in patterns:
              m=re.search(pattern,text,re.I)
              if m:
                  print(html.unescape(m.group(1)))
                  break
          else:
              raise SystemExit('MediaFire direct download link not found')
          PY
          DIRECT="$(cat /tmp/direct-url.txt)"
          test -n "$DIRECT"
          curl -fL --retry 3 -A 'Mozilla/5.0' "$DIRECT" -o /tmp/original.apk
          echo 'a441a8321edba13ebd2597863477c409004e7d4475b9221951bf2991e2feee81  /tmp/original.apk' | sha256sum -c -

      - name: Reconstruct build tree
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/payloadgen /tmp/tools /tmp/out
          mkdir -p /tmp/payloadgen /tmp/out
          unzip -q /tmp/original.apk -d /tmp/payloadgen
          mkdir -p /tmp/payloadgen/UPDATE/base
          cp /tmp/payloadgen/assets/template.elf /tmp/payloadgen/UPDATE/base/original-template.elf
          cp /tmp/payloadgen/assemblies/assemblies.blob /tmp/payloadgen/UPDATE/base/original-assemblies.blob
          cp /tmp/payloadgen/AndroidManifest.xml /tmp/payloadgen/UPDATE/base/original-AndroidManifest.xml
          cp -a payload-generator/3.2.0/UPDATE/. /tmp/payloadgen/UPDATE/
          python3 /tmp/payloadgen/UPDATE/scripts/patch_diagnostics.py
          sha256sum /tmp/payloadgen/UPDATE/base/original-template.elf /tmp/payloadgen/assets/template.elf
          echo 'ec778c6b39835e6d9ee8681faf99e827b18da0148b8d8e75f0c9d85925f4b1bc  /tmp/payloadgen/assets/template.elf' | sha256sum -c -

      - name: Prepare compiler and Android build tools
        run: |
          python3 /tmp/payloadgen/UPDATE/scripts/prepare.py --base /tmp/payloadgen --tools /tmp/tools

      - name: Build 3.5.3 BGFT cover ELF
        if: github.ref == 'refs/heads/feature/3.5.3-bgft-cover'
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/dpi
          git clone https://github.com/marcussacana/DirectPackageInstaller.git /tmp/dpi
          cd /tmp/dpi
          git checkout ca7bade66737fede3b0e7bad73b665e0a4d4ff39
          cd Payload
          make -C lib clean
          make -C lib lib.a
          cp "$GITHUB_WORKSPACE/payload-generator/3.2.0/UPDATE/native/bgft_cover_353.c" ./bgft_cover_353.c
          gcc -g -mcmodel=small -isystem freebsd-headers -nostdinc -nostdlib \
            -fno-stack-protector -static lib/lib.a bgft_cover_353.c ps4-libjbc/*.c \
            -Wl,-gc-sections -o /tmp/bgft-cover-353.elf -fPIE -ffreestanding
          cp /tmp/bgft-cover-353.elf /tmp/payloadgen/assets/template.elf
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/payloadgen/assets/template.elf').read_bytes()
          assert p[:4] == b'\x7fELF'
          for marker,width in [
              (b'###CONTENT_ID_PLACEHOLDER###',64),
              (b'###URL_PLACEHOLDER###',2048),
              (b'###NAME_PLACEHOLDER###',128),
              (b'###TYPE###',16),
          ]:
              needle=marker+b'\0'*(width-len(marker))
              assert p.count(needle)==1, (marker,p.count(needle))
          assert p.count(b'\xbb'*8)==1
          assert p.count(b'###ICON_PLACEHOLDER###')==1
          assert p.count(b'###ICON_SIZE###')==1
          assert b'/user/data/tayson_bgft_icon.png' in p
          print('3.5.3 cover ELF verified:', len(p))
          PY

      - name: Validate Worker v12 BGFT compatibility profile
        shell: bash
        run: |
          set -euxo pipefail
          WORKER=/tmp/payloadgen/UPDATE/cloudflare/universal_transport_worker_v12.js
          cp "$WORKER" /tmp/tayson-worker-v12.mjs
          node --check /tmp/tayson-worker-v12.mjs
          grep -q 'v12-bgft-compat-9-12' "$WORKER"
          grep -q 'ps4-bgft-fw-9-12' "$WORKER"
          grep -q '/api/mocha-routes' "$WORKER"
          grep -q '/api/filek-routes' "$WORKER"
          grep -q '/api/viking-routes' "$WORKER"
          grep -q '/api/rootz-routes' "$WORKER"
          grep -q 'Accept-Encoding.*identity' "$WORKER"
          node /tmp/payloadgen/UPDATE/tests/worker_v12_selftest.mjs /tmp/tayson-worker-v12.mjs

      - name: Run core tests
        shell: bash
        run: |
          set -euxo pipefail
          /tmp/tools/dotnet/dotnet run --project /tmp/payloadgen/UPDATE/tests/Tests.csproj -- /tmp/payloadgen/assets/template.elf | tee /tmp/out/tests.log
          grep -Eq 'RESULT: [0-9]+ checks passed' /tmp/out/tests.log

      - name: Build Tayson 3.5.3
        shell: bash
        run: |
          set -euxo pipefail
          python3 /tmp/payloadgen/UPDATE/scripts/build.py --base /tmp/payloadgen --tools /tmp/tools --output /tmp/out | tee /tmp/out/build.log
          test -s /tmp/payloadgen/UPDATE/build/aligned.apk

          python3 /tmp/payloadgen/UPDATE/scripts/apply_release_identity.py \
            --apk /tmp/payloadgen/UPDATE/build/aligned.apk \
            --icon-source /tmp/payloadgen/UPDATE/assets/tayson-launcher.jpg \
            --output /tmp/out/PS4-Payload-Generator-3.5.3-TaySon.apk \
            --unsigned-output /tmp/out/PS4-Payload-Generator-3.5.3-aligned-unsigned.apk \
            --tools /tmp/tools \
            --keystore /tmp/payloadgen/UPDATE/signing/tayson-test.jks \
            --build-info /tmp/out/build-info.json

          test -s /tmp/out/PS4-Payload-Generator-3.5.3-TaySon.apk
          test -s /tmp/out/PS4-Payload-Generator-3.5.3-aligned-unsigned.apk
          /tmp/tools/android/android-15/aapt dump badging /tmp/out/PS4-Payload-Generator-3.5.3-TaySon.apk | grep -q "package: name='com.tayson.ps4payloadgenerator'"

          cp /tmp/tools/android/android-15/lib/apksigner.jar /tmp/out/apksigner.jar
          cp /tmp/payloadgen/UPDATE/cloudflare/universal_transport_worker_v8.js /tmp/out/
          cp /tmp/payloadgen/UPDATE/cloudflare/universal_transport_worker_v11_2.js /tmp/out/
          cp /tmp/payloadgen/UPDATE/cloudflare/universal_transport_worker_v12.js /tmp/out/
          cp payload-generator/3.2.0/README.md /tmp/out/README-3.5.3.md
          cp payload-generator/3.2.0/VALIDATION.md /tmp/out/VALIDATION-3.5.3.md
          sha256sum /tmp/out/PS4-Payload-Generator-3.5.3-TaySon.apk /tmp/out/PS4-Payload-Generator-3.5.3-aligned-unsigned.apk > /tmp/out/SHA256SUMS.txt
          cat /tmp/out/build-info.json

      - name: Publish 3.4.3 FileKeeper dlproxy prerelease
        if: github.ref == 'refs/heads/feature/3.4.3-filek-dlproxy'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG='v3.4.3-filek-dlproxy-test'
          gh release delete "$TAG" --cleanup-tag -y || true
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title 'Tayson 3.4.3 — FileKeeper dlproxy route fix' \
            --notes 'Candidato de teste físico para CE-32942-0. Preserva a identidade FileKeeper após a resolução da URL e força rota Worker terminada em .pkg; usa Worker v11.2.' \
            --prerelease
          gh release upload "$TAG" \
            /tmp/out/PS4-Payload-Generator-3.5.3-TaySon.apk \
            /tmp/out/universal_transport_worker_v11_2.js \
            /tmp/out/SHA256SUMS.txt \
            --clobber

      - name: Publish 3.5.3 BGFT cover prerelease
        if: github.ref == 'refs/heads/feature/3.5.3-bgft-cover'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG='v3.5.3-bgft-cover-test'
          gh release delete "$TAG" --cleanup-tag -y || true
          cat > /tmp/out/RELEASE-NOTES-3.5.3.md <<'EOF'
          # Tayson PS4 Payload Generator 3.5.3 — BGFT Cover

          Candidato de teste físico para PS4 FW 12.02 / GoldHEN com BinLoader 9090.

          - extrai icon0/pic0/pic1 do próprio PKG;
          - injeta a primeira capa válida no ELF em memória;
          - o payload grava somente /user/data/tayson_bgft_icon.png, sobrescrevendo a capa anterior;
          - passa esse caminho local em icon_path ao BGFT;
          - mantém a rota de PKG/Worker v12 separada da arte;
          - não acumula vários arquivos de capa;
          - mantém o fluxo Android -> 9090 -> BGFT.

          Uso destinado a conteúdo autorizado, homebrew e testes em hardware próprio.
          EOF
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title 'Tayson 3.5.3 — BGFT Cover' \
            --notes-file /tmp/out/RELEASE-NOTES-3.5.3.md \
            --prerelease
          gh release upload "$TAG" \
            /tmp/out/PS4-Payload-Generator-3.5.3-TaySon.apk \
            /tmp/out/universal_transport_worker_v12.js \
            /tmp/out/SHA256SUMS.txt \
            --clobber

      - name: Publish 3.5.1 BGFT update fix prerelease
        if: github.ref == 'refs/heads/feature/3.5.0-mega-bgft-worker-v12'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG='v3.5.1-bgft-update-fix-test'
          gh release delete "$TAG" --cleanup-tag -y || true
          cat > /tmp/out/RELEASE-NOTES-3.5.0.md <<'EOF'
          # Tayson PS4 Payload Generator 3.5.1 — BGFT update registration fix

          Candidato de teste físico reconstruído diretamente sobre a base estável 3.4.3.

          - mantém o template ELF/BGFT validado da 3.4.3 sem trocar a API nativa;
          - corrige atualização de jogo: PS4PATCH da interface é convertido para o package_type BGFT válido PS4GD;
          - mantém o envio GoldHEN BinLoader TCP 9090;
          - Worker v12 com perfil conservador para PS4 firmware 9.x–12.x;
          - HEAD emulado por GET Range 0-0;
          - validação estrita de Content-Range;
          - Accept-Encoding identity em upstream;
          - redirects limitados ao mesmo provedor aprovado;
          - rotas dedicadas para VikingFile, Rootz, Mocha, FileKeeper e AkiraBox;
          - suporte AkiraBox regional;
          - KV ROUTES preferido para URLs curtas e contexto de sessão;
          - URLs, cookies e tokens não são gravados nos logs do Worker.

          A compatibilidade 9.x–12.x é alvo de engenharia, não garantia até completar
          a matriz de testes físicos em consoles/firmwares correspondentes.

          Uso destinado a homebrew, desenvolvimento e conteúdo autorizado.
          EOF
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title 'Tayson 3.5.1 — BGFT update registration fix' \
            --notes-file /tmp/out/RELEASE-NOTES-3.5.0.md \
            --prerelease
          gh release upload "$TAG" \
            /tmp/out/PS4-Payload-Generator-3.5.3-TaySon.apk \
            /tmp/out/universal_transport_worker_v12.js \
            /tmp/out/SHA256SUMS.txt \
            --clobber

      - name: Publish stable v3.4.3 release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG='v3.4.3'
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Stable release $TAG already exists; leaving validated assets unchanged."
            exit 0
          fi
          cat > /tmp/out/RELEASE-NOTES.md <<'EOF'
          # Tayson PS4 Payload Generator 3.4.3

          Release estável validada em PS4 real.

          - aplicativo 3.4.3 / versionCode 40;
          - Worker v11.2;
          - Mocha via `/m/<token>.pkg`;
          - FileKeeper via `/f/<token>.pkg`, incluindo `dlproxy.uk`;
          - VikingFile via `/v/<token>.pkg`;
          - Rootz/R2 via `/d/<token>.pkg`;
          - AkiraBox via `/a/<token>.pkg`;
          - binding: `ROUTES -> tayson-payload-routes`;
          - 103 checks aprovados;
          - template ELF preservado:
            `ec778c6b39835e6d9ee8681faf99e827b18da0148b8d8e75f0c9d85925f4b1bc`.

          Uso destinado a desenvolvimento, homebrew, testes e gerenciamento de conteúdo autorizado.
          EOF
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title 'Tayson PS4 Payload Generator 3.4.3' \
            --notes-file /tmp/out/RELEASE-NOTES.md \
            --latest \
            /tmp/out/PS4-Payload-Generator-3.5.3-TaySon.apk \
            /tmp/out/universal_transport_worker_v11_2.js \
            /tmp/out/SHA256SUMS.txt
          sha256sum /tmp/out/PS4-Payload-Generator-3.5.3-TaySon.apk
