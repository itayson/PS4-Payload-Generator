name: Tayson PS4 Payload Generator 3.5.1 BGFT seek Worker

on:
  push:
    branches:
      - main
      - feature/payload-generator-bgft-universal
      - feature/neon-ui-redesign
      - feature/3.4.0-paste-metadata-icon
      - feature/3.4.1-unified-provider-routes
      - feature/3.4.2-filek-provider-context
      - feature/3.4.3-filek-dlproxy
      - feature/3.5.0-bgft-worker-stable
  pull_request:
    branches:
      - main
      - feature/payload-generator-bgft-universal
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq liblz4-1 unzip curl

      - name: Download verified Phoenixx V3 base APK
        shell: bash
        run: |
          set -euxo pipefail
          PAGE='https://www.mediafire.com/file/hi4h13wzunr2bjm/phoenixx.ps4remotepkg_v3.0%2B%282%29.apk/file'
          curl -fL --retry 3 -A 'Mozilla/5.0' "$PAGE" -o /tmp/mediafire.html
          python3 - <<'PY' >/tmp/direct-url.txt
          import html, re
          text=open('/tmp/mediafire.html',encoding='utf-8',errors='ignore').read()
          patterns=[
              r'id=["\']downloadButton["\'][^>]*href=["\']([^"\']+)',
              r'href=["\']([^"\']+)["\'][^>]*id=["\']downloadButton["\']'
          ]
          for pattern in patterns:
              m=re.search(pattern,text,re.I)
              if m:
                  print(html.unescape(m.group(1)))
                  break
          else:
              raise SystemExit('MediaFire direct download link not found')
          PY
          DIRECT="$(cat /tmp/direct-url.txt)"
          test -n "$DIRECT"
          curl -fL --retry 3 -A 'Mozilla/5.0' "$DIRECT" -o /tmp/original.apk
          echo 'a441a8321edba13ebd2597863477c409004e7d4475b9221951bf2991e2feee81  /tmp/original.apk' | sha256sum -c -

      - name: Reconstruct build tree
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/payloadgen /tmp/tools /tmp/out
          mkdir -p /tmp/payloadgen /tmp/out
          unzip -q /tmp/original.apk -d /tmp/payloadgen
          mkdir -p /tmp/payloadgen/UPDATE/base
          cp /tmp/payloadgen/assets/template.elf /tmp/payloadgen/UPDATE/base/original-template.elf
          cp /tmp/payloadgen/assemblies/assemblies.blob /tmp/payloadgen/UPDATE/base/original-assemblies.blob
          cp /tmp/payloadgen/AndroidManifest.xml /tmp/payloadgen/UPDATE/base/original-AndroidManifest.xml
          cp -a payload-generator/3.2.0/UPDATE/. /tmp/payloadgen/UPDATE/
          python3 /tmp/payloadgen/UPDATE/scripts/patch_diagnostics.py
          sha256sum /tmp/payloadgen/UPDATE/base/original-template.elf /tmp/payloadgen/assets/template.elf

      - name: Prepare compiler and Android build tools
        run: |
          python3 /tmp/payloadgen/UPDATE/scripts/prepare.py --base /tmp/payloadgen --tools /tmp/tools

      - name: Build canonical BGFT template
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ZIP=/tmp/ps4-payload-sdk.zip
          SDK_DIR=/tmp/ps4-payload-sdk
          JBC_DIR=/tmp/ps4-libjbc
          curl -fL --retry 3 \
            https://github.com/ps4-payload-dev/sdk/releases/download/v0.9/ps4-payload-sdk.zip \
            -o "$SDK_ZIP"
          echo '3190e88255a72161e5ce2f22a8ae8f638a2c5a9d1ff1e0209ed692d36b4d9ec5  /tmp/ps4-payload-sdk.zip' | sha256sum -c -
          rm -rf "$SDK_DIR" "$JBC_DIR"
          mkdir -p "$SDK_DIR"
          unzip -q "$SDK_ZIP" -d "$SDK_DIR"

          git clone -q https://github.com/sleirsgoevy/ps4-libjbc.git "$JBC_DIR"
          git -C "$JBC_DIR" checkout -q 4dd18714fa7af7e15813d6a11537b60bb8c6f79c
          mkdir -p /tmp/payloadgen/UPDATE/payload-bgft/ps4-libjbc
          cp "$JBC_DIR"/{defs.h,jailbreak.c,jailbreak.h,kernelrw.c,kernelrw.h} \
            /tmp/payloadgen/UPDATE/payload-bgft/ps4-libjbc/

          LLVM_CONFIG="$(command -v llvm-config-18 || command -v llvm-config-17 || command -v llvm-config || true)"
          if [ -z "$LLVM_CONFIG" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq llvm-18 clang-18 lld-18
            LLVM_CONFIG="$(command -v llvm-config-18)"
          fi

          PS4_PAYLOAD_SDK="$SDK_DIR/ps4-payload-sdk" LLVM_CONFIG="$LLVM_CONFIG" \
            make -C /tmp/payloadgen/UPDATE/payload-bgft clean all

          cp /tmp/payloadgen/UPDATE/payload-bgft/template.elf /tmp/payloadgen/assets/template.elf

          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/payloadgen/assets/template.elf').read_bytes()
          markers=[
              (b'###URL_PLACEHOLDER###',2048,'URL'),
              (b'###CONTENT_ID_PLACEHOLDER###',64,'CONTENT_ID'),
              (b'###NAME_PLACEHOLDER###',128,'NAME'),
              (b'###TYPE###',16,'TYPE'),
          ]
          for text,width,name in markers:
              needle=text+b'\0'*(width-len(text))
              count=p.count(needle)
              if count != 1:
                  raise SystemExit(f'{name} marker count = {count}, expected 1')
          if p.count(b'\xbb'*8) != 1:
              raise SystemExit('PKG_SIZE marker is missing or duplicated')
          required=[
              b'Tayson 3.5.0 BGFT CANONICAL',
              b'sceUserServiceGetForegroundUser',
              b'sceUserServiceTerminate',
              b'sceBgftServiceIntDebugDownloadRegisterPkg',
              b'sceBgftServiceDownloadRegisterTask',
              b'sceBgftServiceIntDownloadStartTask',
          ]
          for item in required:
              if item not in p:
                  raise SystemExit('Missing payload capability: '+item.decode())
          print('Canonical BGFT template validation: OK')
          PY

          file /tmp/payloadgen/assets/template.elf
          sha256sum /tmp/payloadgen/assets/template.elf


      - name: Validate Worker v11.2
        shell: bash
        run: |
          set -euxo pipefail
          node --check /tmp/payloadgen/UPDATE/cloudflare/universal_transport_worker_v11_2.js
          grep -q '/api/mocha-routes' /tmp/payloadgen/UPDATE/cloudflare/universal_transport_worker_v11_2.js
          grep -q '/api/filek-routes' /tmp/payloadgen/UPDATE/cloudflare/universal_transport_worker_v11_2.js
          grep -q '/api/viking-routes' /tmp/payloadgen/UPDATE/cloudflare/universal_transport_worker_v11_2.js

      - name: Run core tests
        shell: bash
        run: |
          set -euxo pipefail
          /tmp/tools/dotnet/dotnet run --project /tmp/payloadgen/UPDATE/tests/Tests.csproj -- /tmp/payloadgen/assets/template.elf | tee /tmp/out/tests.log
          grep -q 'RESULT: 106 checks passed' /tmp/out/tests.log

      - name: Build Tayson 3.5.1 BGFT canonical
        shell: bash
        run: |
          set -euxo pipefail
          python3 /tmp/payloadgen/UPDATE/scripts/build.py --base /tmp/payloadgen --tools /tmp/tools --output /tmp/out | tee /tmp/out/build.log
          test -s /tmp/payloadgen/UPDATE/build/aligned.apk

          python3 /tmp/payloadgen/UPDATE/scripts/apply_release_identity.py \
            --apk /tmp/payloadgen/UPDATE/build/aligned.apk \
            --icon-source /tmp/payloadgen/UPDATE/assets/tayson-launcher.jpg \
            --output /tmp/out/PS4-Payload-Generator-3.5.1-BGFT-TaySon.apk \
            --unsigned-output /tmp/out/PS4-Payload-Generator-3.5.1-BGFT-aligned-unsigned.apk \
            --tools /tmp/tools \
            --keystore /tmp/payloadgen/UPDATE/signing/tayson-test.jks \
            --build-info /tmp/out/build-info.json

          test -s /tmp/out/PS4-Payload-Generator-3.5.1-BGFT-TaySon.apk
          test -s /tmp/out/PS4-Payload-Generator-3.5.1-BGFT-aligned-unsigned.apk
          /tmp/tools/android/android-15/aapt dump badging /tmp/out/PS4-Payload-Generator-3.5.1-BGFT-TaySon.apk | grep -q "package: name='com.tayson.ps4payloadgenerator'"

          cp /tmp/tools/android/android-15/lib/apksigner.jar /tmp/out/apksigner.jar
          cp /tmp/payloadgen/UPDATE/cloudflare/universal_transport_worker_v8.js /tmp/out/
          cp /tmp/payloadgen/UPDATE/cloudflare/universal_transport_worker_v11_2.js /tmp/out/
          cp payload-generator/3.2.0/README.md /tmp/out/README-3.5.0.md
          cp /tmp/payloadgen/assets/template.elf /tmp/out/template-bgft-3.5.0.elf
          cp payload-generator/3.2.0/VALIDATION.md /tmp/out/VALIDATION-3.5.0.md
          sha256sum /tmp/out/PS4-Payload-Generator-3.5.1-BGFT-TaySon.apk /tmp/out/PS4-Payload-Generator-3.5.1-BGFT-aligned-unsigned.apk > /tmp/out/SHA256SUMS.txt
          cat /tmp/out/build-info.json

      - name: Publish 3.5.1 BGFT seek Worker prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG='v3.5.1-bgft-seek-worker-test'
          gh release delete "$TAG" --cleanup-tag -y || true
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title 'Tayson 3.5.1 — BGFT canonical / Worker seek' \
            --notes 'Pequena atualização do candidato BGFT para PS4 FW 12.02. Preserva Android → Worker → ELF → BinLoader 9090 → BGFT. O Worker padrão agora é https://seek.itaysondaniel.workers.dev/ e o app migra automaticamente o endpoint antigo drive.itaysondaniel.workers.dev salvo nas preferências. ELF/BGFT e Worker v11.2 permanecem iguais.' \
            --prerelease
          gh release upload "$TAG" \
            /tmp/out/PS4-Payload-Generator-3.5.1-BGFT-TaySon.apk \
            /tmp/out/universal_transport_worker_v11_2.js \
            /tmp/out/template-bgft-3.5.0.elf \
            /tmp/out/SHA256SUMS.txt \
            --clobber
