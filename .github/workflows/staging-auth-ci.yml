name: Tayson Android Staging Auth - isolated CI
on:
  push:
    branches:
      - feature/3.4.3-staging-auth-keystore
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-auth-tests:
    if: github.ref == 'refs/heads/feature/3.4.3-staging-auth-keystore'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile and test staging authentication
        run: |
          set -euxo pipefail
          dotnet run --project tools/staging-auth/tests/StagingAuthTests.csproj -c Release
      - name: Verify staging safeguards and production source
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path("payload-generator/3.2.0/UPDATE/src")
          planner=(src/"BgftRoutePlanner.cs").read_text()
          auth=(src/"StagingRouteAuth.cs").read_text()
          settings=(src/"UiSettingsScreen.cs").read_text()
          assert planner.count("await AuthorizeStagingRouteAsync(request)") == 3
          assert "if (isStaging)" in planner and "fallback inline bloqueado" in planner
          assert 'DefaultWorkerBase = "https://drive.itaysondaniel.workers.dev"' in planner
          assert 'uri.IdnHost.Equals(Host, StringComparison.OrdinalIgnoreCase)' in auth
          assert 'currentCredential = credential' in auth
          assert 'stagingKey.IsPassword = true' in settings
          assert 'UiStateStore.SaveWorkerUrl(workerValue)' in settings
          assert 'StagingRouteAuth.SaveAsync(stagingKey.Text)' in settings
          print("PASS: staging-only auth; five providers; production default preserved")
          PY

  experimental-apk:
    needs: staging-auth-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq liblz4-1 unzip curl
      - name: Download pinned upstream Android base
        shell: bash
        run: |
          set -euxo pipefail
          PAGE='https://www.mediafire.com/file/hi4h13wzunr2bjm/phoenixx.ps4remotepkg_v3.0%2B%282%29.apk/file'
          curl -fL --retry 3 -A 'Mozilla/5.0' "$PAGE" -o /tmp/mediafire.html
          python3 - <<'PY' >/tmp/direct-url.txt
          import html,re
          text=open('/tmp/mediafire.html',encoding='utf-8',errors='ignore').read()
          for pat in (r'id=["\']downloadButton["\'][^>]*href=["\']([^"\']+)',r'href=["\']([^"\']+)["\'][^>]*id=["\']downloadButton["\']'):
              m=re.search(pat,text,re.I)
              if m:
                  print(html.unescape(m.group(1)))
                  break
          else:
              raise SystemExit('Pinned Phoenixx V3 download link unavailable')
          PY
          DIRECT="$(cat /tmp/direct-url.txt)"
          test -n "$DIRECT"
          curl -fL --retry 3 -A 'Mozilla/5.0' "$DIRECT" -o /tmp/original.apk
          echo 'a441a8321edba13ebd2597863477c409004e7d4475b9221951bf2991e2feee81  /tmp/original.apk' | sha256sum -c -
      - name: Prepare reconstruction
        run: |
          set -euxo pipefail
          mkdir -p /tmp/payloadgen /tmp/out
          unzip -q /tmp/original.apk -d /tmp/payloadgen
          mkdir -p /tmp/payloadgen/UPDATE/base
          cp /tmp/payloadgen/assets/template.elf /tmp/payloadgen/UPDATE/base/original-template.elf
          cp /tmp/payloadgen/assemblies/assemblies.blob /tmp/payloadgen/UPDATE/base/original-assemblies.blob
          cp /tmp/payloadgen/AndroidManifest.xml /tmp/payloadgen/UPDATE/base/original-AndroidManifest.xml
          cp -a payload-generator/3.2.0/UPDATE/. /tmp/payloadgen/UPDATE/
          python3 /tmp/payloadgen/UPDATE/scripts/patch_diagnostics.py
          python3 /tmp/payloadgen/UPDATE/scripts/prepare.py --base /tmp/payloadgen --tools /tmp/tools
      - name: Existing core tests
        run: |
          set -euxo pipefail
          /tmp/tools/dotnet/dotnet run --project /tmp/payloadgen/UPDATE/tests/Tests.csproj -- /tmp/payloadgen/assets/template.elf | tee /tmp/out/core-tests.log
          grep -q 'RESULT: 103 checks passed' /tmp/out/core-tests.log
      - name: Rebuild and sign experimental Android package
        run: |
          set -euxo pipefail
          python3 /tmp/payloadgen/UPDATE/scripts/build.py --base /tmp/payloadgen --tools /tmp/tools --output /tmp/out | tee /tmp/out/build.log
          test -s /tmp/payloadgen/UPDATE/build/aligned.apk
          python3 /tmp/payloadgen/UPDATE/scripts/apply_release_identity.py \
            --apk /tmp/payloadgen/UPDATE/build/aligned.apk \
            --icon-source /tmp/payloadgen/UPDATE/assets/tayson-launcher.jpg \
            --output /tmp/out/PS4-Payload-Generator-Staging-Auth-EXPERIMENTAL.apk \
            --unsigned-output /tmp/out/staging-auth-unsigned.apk \
            --tools /tmp/tools \
            --keystore /tmp/payloadgen/UPDATE/signing/tayson-test.jks \
            --new-package com.tayson.ps4payloadgenerator.staging \
            --build-info /tmp/out/build-info.json
          /tmp/tools/android/android-15/aapt dump badging /tmp/out/PS4-Payload-Generator-Staging-Auth-EXPERIMENTAL.apk | grep -q "package: name='com.tayson.ps4payloadgenerator.staging'"
          /tmp/tools/android/android-15/apksigner verify --verbose --print-certs /tmp/out/PS4-Payload-Generator-Staging-Auth-EXPERIMENTAL.apk | tee /tmp/out/signature.txt
          sha256sum /tmp/out/PS4-Payload-Generator-Staging-Auth-EXPERIMENTAL.apk > /tmp/out/SHA256SUMS.txt
          echo 'EXPERIMENTAL PACKAGE: separate com.tayson.ps4payloadgenerator.staging identity. Keep the stable 3.4.3 installed.' > /tmp/out/INSTALL_WARNING.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tayson-auth-test-build
          path: |
            /tmp/out/PS4-Payload-Generator-Staging-Auth-EXPERIMENTAL.apk
            /tmp/out/SHA256SUMS.txt
            /tmp/out/signature.txt
            /tmp/out/core-tests.log
            /tmp/out/build.log
            /tmp/out/INSTALL_WARNING.txt
          if-no-files-found: error
          retention-days: 7
