name: Temporary Tayson PS4 Downloader 3.0.0 PDF RPI Build

on:
  push:
    branches:
      - build/tayson-pdf-rpi-3.0.0

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore validated Tayson PS4 Downloader 2.0.1 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          curl -fL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o /tmp/onetap201.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10301229088/zip"
          rm -rf /tmp/onetap201 /tmp/TaysonRpi300
          mkdir -p /tmp/onetap201 /tmp/TaysonRpi300
          unzip -q /tmp/onetap201.zip -d /tmp/onetap201
          test -s /tmp/onetap201/TaysonPS4Downloader-2.0.1-OneTap-source.tar.gz
          tar -xzf /tmp/onetap201/TaysonPS4Downloader-2.0.1-OneTap-source.tar.gz \
            -C /tmp/TaysonRpi300 --strip-components=1

      - name: Apply PDF-driven RPI-first architecture
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/TaysonRpi300
          mkdir -p app/src/main/java/com/tayson/ps4linksender/ps4
          cp "$GITHUB_WORKSPACE/app/src/main/java/com/tayson/ps4linksender/ps4/RpiClient.kt" \
             app/src/main/java/com/tayson/ps4linksender/ps4/RpiClient.kt
          patch -p1 < "$GITHUB_WORKSPACE/ci300rpi/main300.patch"
          sed -i 's/versionCode = 31/versionCode = 40/' app/build.gradle.kts
          sed -i 's/versionName = "2.0.1"/versionName = "3.0.0"/' app/build.gradle.kts
          grep -q 'versionCode = 40' app/build.gradle.kts
          grep -q 'versionName = "3.0.0"' app/build.gradle.kts
          grep -q 'RPI-FIRST' app/src/main/java/com/tayson/ps4linksender/MainActivity.kt
          grep -q 'RpiClient.install' app/src/main/java/com/tayson/ps4linksender/MainActivity.kt
          grep -q '/api/install' app/src/main/java/com/tayson/ps4linksender/ps4/RpiClient.kt
          grep -q '/api/get_task_progress' app/src/main/java/com/tayson/ps4linksender/ps4/RpiClient.kt
          grep -q '/api/pause_task' app/src/main/java/com/tayson/ps4linksender/ps4/RpiClient.kt
          grep -q '/api/resume_task' app/src/main/java/com/tayson/ps4linksender/ps4/RpiClient.kt
          grep -q '/api/unregister_task' app/src/main/java/com/tayson/ps4linksender/ps4/RpiClient.kt

      - name: Lint and build Android 3.0.0 RPI-first
        shell: bash
        run: |
          set -o pipefail
          cd /tmp/TaysonRpi300
          gradle --no-daemon :app:lintUniversalDebug :app:assembleUniversalDebug 2>&1 | tee android-build-3.0.0-rpi.log
          test -s app/build/outputs/apk/universal/debug/app-universal-debug.apk

      - name: Prepare 3.0.0 artifacts
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/TaysonRpi300
          mkdir -p dist
          cp app/build/outputs/apk/universal/debug/app-universal-debug.apk \
             dist/Tayson-PS4-Downloader-3.0.0-RPI-First-universal-debug.apk
          cp android-build-3.0.0-rpi.log dist/
          cat > dist/ARCHITECTURE.txt <<'TXT'
          Tayson PS4 Downloader 3.0.0 — PDF-driven RPI-first architecture

          Primary path:
          provider link -> resolver -> validated PKG URL -> Remote Package Installer HTTP API
          -> PS4 BGFT/system download.

          RPI ports probed: 12800, 11200
          Install: POST /api/install
          Progress: POST /api/get_task_progress
          Pause: POST /api/pause_task
          Resume: POST /api/resume_task
          Cancel: POST /api/unregister_task

          Automatic fallback:
          if RPI is unavailable or rejects the request, the app uses the existing
          one-shot GoldHEN BinLoader/BGFT payload path on port 9090.

          Existing provider resolvers, WebView capture, Receiver diagnostics,
          local Payload Installer and relay fallback remain in the source tree.
          TXT
          tar -czf dist/TaysonPS4Downloader-3.0.0-RPI-First-source.tar.gz \
            --exclude='./dist' --exclude='./app/build' --exclude='./.gradle' .
          (cd dist && sha256sum \
            Tayson-PS4-Downloader-3.0.0-RPI-First-universal-debug.apk \
            TaysonPS4Downloader-3.0.0-RPI-First-source.tar.gz > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload Tayson PS4 Downloader 3.0.0 RPI-first
        uses: actions/upload-artifact@v4
        with:
          name: Tayson-PS4-Downloader-3.0.0-RPI-First
          path: /tmp/TaysonRpi300/dist/*
          if-no-files-found: error
          retention-days: 30
