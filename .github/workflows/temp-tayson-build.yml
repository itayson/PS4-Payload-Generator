name: Temporary Tayson 0.5.5 Native Bridge Skip NetCtl Build

on:
  push:
    branches:
      - build/tayson-ps4-link-sender-0.5.0

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore validated 0.5.0 source tree
        shell: bash
        run: bash ./scripts/test-core.sh

      - name: Apply 0.5.1 through 0.5.5 fixes
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/prepare-051.py
          python3 scripts/prepare-052.py
          python3 scripts/prepare-053.py
          python3 scripts/prepare-054.py
          python3 scripts/prepare-055.py
          grep -q 'versionCode = 12' app/build.gradle.kts
          grep -q 'versionName = "0.5.5"' app/build.gradle.kts
          grep -q '#define HTTP_HEADER_OVERWRITE 0' ps4bridge/main.c
          grep -q 'Tayson Native Bridge 0.5.5 iniciado' ps4bridge/main.c
          grep -q 'NET 1/2 - NetInit (NetCtl ignorado)' ps4bridge/main.c
          ! grep -q 'ret = p_netctl_init();' ps4bridge/main.c
          grep -q 'libSceHttp.sprx' ps4bridge/main.c
          ! grep -q 'libSceHttp2.sprx' ps4bridge/main.c
          grep -q 'preflight CDN bytes=0-0' ps4bridge/main.c
          grep -q 'SendMode.AUTO -> provider != Provider.MOCHA' app/src/main/java/com/tayson/ps4linksender/MainActivity.kt

      - name: Install PS4 Payload SDK
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -o /tmp/ps4-payload-sdk.zip \
            https://github.com/ps4-payload-dev/sdk/releases/latest/download/ps4-payload-sdk.zip
          sudo rm -rf /opt/ps4-payload-sdk
          sudo unzip -q /tmp/ps4-payload-sdk.zip -d /opt
          test -x /opt/ps4-payload-sdk/bin/orbis-clang
          /opt/ps4-payload-sdk/bin/orbis-clang --version || true

      - name: Fetch ps4-libjbc
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf ps4bridge/ps4-libjbc
          git clone --depth 1 https://github.com/sleirsgoevy/ps4-libjbc.git ps4bridge/ps4-libjbc

      - name: Build PS4 Native Bridge ELF 0.5.5
        shell: bash
        run: |
          set -euxo pipefail
          export PS4_PAYLOAD_SDK=/opt/ps4-payload-sdk
          make -C ps4bridge clean all
          test -s ps4bridge/native_bridge.elf
          file ps4bridge/native_bridge.elf
          sha256sum ps4bridge/native_bridge.elf
          cp ps4bridge/native_bridge.elf app/src/main/assets/native_bridge.elf

      - name: Validate 0.5.5 source and native ELF
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/validate_project.py
          test -s app/src/main/assets/native_bridge.elf
          grep -a -q 'TAYSON_BRIDGE_UPSTREAM_URL_V1' app/src/main/assets/native_bridge.elf
          grep -a -q 'TAYSON_BRIDGE_EXTRA_HEADERS_V1' app/src/main/assets/native_bridge.elf
          grep -a -q 'Tayson Native Bridge 0.5.5 iniciado' app/src/main/assets/native_bridge.elf
          grep -a -q 'NET 1/2 - NetInit (NetCtl ignorado)' app/src/main/assets/native_bridge.elf
          grep -a -q 'preflight CDN bytes=0-0' app/src/main/assets/native_bridge.elf
          grep -a -q 'libSceHttp' app/src/main/assets/native_bridge.elf
          if strings app/src/main/assets/native_bridge.elf | grep -qx 'Registro'; then
            echo 'Unexpected direct-template Registro string in Native Bridge ELF' >&2
            exit 1
          fi

      - name: Lint and build universal APK 0.5.5
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:lintUniversalDebug :app:assembleUniversalDebug 2>&1 | tee ci-build-055.log

      - name: Prepare 0.5.5 release artifacts
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/universal/debug/app-universal-debug.apk \
            dist/Tayson-PS4-Link-Sender-0.5.5-universal-debug.apk
          cp ps4bridge/native_bridge.elf \
            dist/Tayson-PS4-Native-Bridge-0.5.5.elf
          cp ci-build-055.log dist/android-build-0.5.5.log
          (
            cd dist
            sha256sum \
              Tayson-PS4-Link-Sender-0.5.5-universal-debug.apk \
              Tayson-PS4-Native-Bridge-0.5.5.elf > SHA256SUMS.txt
          )

      - name: Upload 0.5.5 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tayson-PS4-Link-Sender-0.5.5
          path: dist/*
          if-no-files-found: error
          retention-days: 30
