name: Temporary Tayson APK Build

on:
  push:
    branches:
      - build/tayson-ps4-link-sender-0.3.0

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore validated project bundle and apply 0.3.2 fixes
        run: bash ./scripts/test-core.sh

      - name: Lint and build universal APK
        id: android_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:lintUniversalDebug :app:assembleUniversalDebug 2>&1 | tee ci-build.log

      - name: Prepare artifact
        if: steps.android_build.outcome == 'success'
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/universal/debug/app-universal-debug.apk dist/Tayson-PS4-Link-Sender-0.3.2-universal-debug.apk
          cd dist
          sha256sum *.apk > SHA256SUMS.txt

      - name: Upload APK artifact
        if: steps.android_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Tayson-PS4-Link-Sender-0.3.2
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Record CI result
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.android_build.outcome }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p ci-output
          {
            echo "outcome=$BUILD_OUTCOME"
            echo "run_id=$RUN_ID"
            echo "source_sha=$SOURCE_SHA"
          } > ci-output/result-032.txt
          tail -n 250 ci-build.log > ci-output/build-tail-032.log || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-output
          git commit -m "CI_RESULT Tayson PS4 Link Sender 0.3.2: $BUILD_OUTCOME [skip ci]" || true
          git push origin HEAD:build/tayson-ps4-link-sender-0.3.0 || true

      - name: Fail workflow when Android build failed
        if: steps.android_build.outcome != 'success'
        run: exit 1
