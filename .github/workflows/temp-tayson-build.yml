name: Temporary Tayson 0.5.1 Native Bridge 403 Fix Build

on:
  push:
    branches:
      - build/tayson-ps4-link-sender-0.5.0

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore validated 0.5.0 source tree
        shell: bash
        run: bash ./scripts/test-core.sh

      - name: Apply 0.5.1 403 and loopback fixes
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/prepare-051.py
          grep -q 'versionCode = 8' app/build.gradle.kts
          grep -q 'versionName = "0.5.1"' app/build.gradle.kts
          grep -q '#define HTTP_HEADER_OVERWRITE 0' ps4bridge/main.c
          grep -q 'pthread_create' ps4bridge/main.c

      - name: Install PS4 Payload SDK
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -o /tmp/ps4-payload-sdk.zip \
            https://github.com/ps4-payload-dev/sdk/releases/latest/download/ps4-payload-sdk.zip
          sudo rm -rf /opt/ps4-payload-sdk
          sudo unzip -q /tmp/ps4-payload-sdk.zip -d /opt
          test -x /opt/ps4-payload-sdk/bin/orbis-clang
          /opt/ps4-payload-sdk/bin/orbis-clang --version || true

      - name: Fetch ps4-libjbc
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf ps4bridge/ps4-libjbc
          git clone --depth 1 https://github.com/sleirsgoevy/ps4-libjbc.git ps4bridge/ps4-libjbc

      - name: Build PS4 Native Bridge ELF 0.5.1
        id: bridge_build
        shell: bash
        run: |
          set -euxo pipefail
          export PS4_PAYLOAD_SDK=/opt/ps4-payload-sdk
          make -C ps4bridge clean all
          test -s ps4bridge/native_bridge.elf
          file ps4bridge/native_bridge.elf
          sha256sum ps4bridge/native_bridge.elf
          cp ps4bridge/native_bridge.elf app/src/main/assets/native_bridge.elf

      - name: Validate 0.5.1 source and native ELF
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/validate_project.py
          test -s app/src/main/assets/native_bridge.elf
          grep -a -q 'TAYSON_BRIDGE_UPSTREAM_URL_V1' app/src/main/assets/native_bridge.elf
          grep -a -q 'TAYSON_BRIDGE_EXTRA_HEADERS_V1' app/src/main/assets/native_bridge.elf

      - name: Lint and build universal APK 0.5.1
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:lintUniversalDebug :app:assembleUniversalDebug 2>&1 | tee ci-build-051.log

      - name: Prepare 0.5.1 release artifacts
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/universal/debug/app-universal-debug.apk \
            dist/Tayson-PS4-Link-Sender-0.5.1-universal-debug.apk
          cp ps4bridge/native_bridge.elf \
            dist/Tayson-PS4-Native-Bridge-0.5.1.elf
          cp ci-build-051.log dist/android-build-0.5.1.log
          (
            cd dist
            sha256sum \
              Tayson-PS4-Link-Sender-0.5.1-universal-debug.apk \
              Tayson-PS4-Native-Bridge-0.5.1.elf > SHA256SUMS.txt
          )

      - name: Upload 0.5.1 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tayson-PS4-Link-Sender-0.5.1
          path: dist/*
          if-no-files-found: error
          retention-days: 30
