name: Temporary Tayson PS4 Receiver 1.0.1 Hotfix Build

on:
  push:
    branches:
      - build/tayson-ps4-suite-1.0.0

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore Suite 1.0.0 source
        shell: bash
        run: |
          set -euxo pipefail
          cat ci100/chunk00 ci100/chunk01 ci100/chunk02 ci100/chunk03 ci100/chunk04 ci100/chunk05 ci100/chunk06 ci100/chunk07 \
            | base64 --decode > /tmp/TaysonPS4Suite-1.0.0-source.tar.gz
          echo 'e0699edd368c3ab4529ab17348538f264abae97717a4da2cf876a4123f5def1b  /tmp/TaysonPS4Suite-1.0.0-source.tar.gz' | sha256sum -c -
          rm -rf /tmp/TaysonPS4Suite-1.0.1
          mkdir -p /tmp/TaysonPS4Suite-1.0.1
          tar -xzf /tmp/TaysonPS4Suite-1.0.0-source.tar.gz -C /tmp/TaysonPS4Suite-1.0.1 --strip-components=1
          test -f /tmp/TaysonPS4Suite-1.0.1/ps4receiver/receiver/main.c

      - name: Apply Receiver 1.0.1 startup and SceNet fixes
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/TaysonPS4Suite-1.0.1
          python3 - <<'PY'
          from pathlib import Path

          makefile = Path('ps4receiver/Makefile')
          text = makefile.read_text()
          text = text.replace('VERSION     := 1.00', 'VERSION     := 1.01')
          text = text.replace(
              'pkg.gp4: eboot.bin sce_sys/param.sfo sce_sys/icon0.png\n\t$(TOOLCHAIN)/bin/$(CDIR)/create-gp4 -out $@ --content-id=$(CONTENT_ID) --files "$^"',
              'RUNTIME_MODULES := $(wildcard sce_module/*.prx)\nEXTRA_PACKAGE_FILES := $(wildcard sce_sys/about/*.sprx)\n\npkg.gp4: eboot.bin sce_sys/param.sfo sce_sys/icon0.png $(RUNTIME_MODULES) $(EXTRA_PACKAGE_FILES)\n\t$(TOOLCHAIN)/bin/$(CDIR)/create-gp4 -out $@ --content-id=$(CONTENT_ID) --files "$^"'
          )
          makefile.write_text(text)

          source = Path('ps4receiver/receiver/main.c')
          text = source.read_text()
          text = text.replace('#define RECEIVER_VERSION "1.0.0"', '#define RECEIVER_VERSION "1.0.1"')
          text = text.replace('Tayson PS4 Receiver 1.0 iniciando', 'Tayson PS4 Receiver 1.0.1 iniciando')
          text = text.replace('Tayson PS4 Receiver 1.0 ativo - porta 9095', 'Tayson PS4 Receiver 1.0.1 ativo - porta 9095')
          text = text.replace('ntohl(', 'sceNetNtohl(')
          text = text.replace('htons(', 'sceNetHtons(')
          text = text.replace('htonl(', 'sceNetHtonl(')
          text = text.replace('send(fd, p, len, 0)', 'sceNetSend(fd, p, len, 0)')
          text = text.replace('recv(fd, p, len, 0)', 'sceNetRecv(fd, p, len, 0)')
          text = text.replace('recv(fd, &c, 1, 0)', 'sceNetRecv(fd, &c, 1, 0)')
          text = text.replace('recv(client, header + used, MAX_REQUEST_HEADER - used, 0)', 'sceNetRecv(client, header + used, MAX_REQUEST_HEADER - used, 0)')
          text = text.replace('int fd = socket(AF_INET, SOCK_STREAM, 0);', 'int fd = sceNetSocket("tayson_receiver", ORBIS_NET_AF_INET, ORBIS_NET_SOCK_STREAM, 0);')
          text = text.replace('setsockopt(fd, SOL_SOCKET, SO_REUSEADDR, &yes, sizeof(yes));', 'sceNetSetsockopt(fd, SOL_SOCKET, SO_REUSEADDR, &yes, sizeof(yes));')
          text = text.replace('if (bind(fd, (struct sockaddr *)&addr, sizeof(addr)) < 0) { close(fd); return -1; }', 'if (sceNetBind(fd, (const OrbisNetSockaddr *)&addr, sizeof(addr)) < 0) { sceNetSocketClose(fd); return -1; }')
          text = text.replace('if (listen(fd, 8) < 0) { close(fd); return -1; }', 'if (sceNetListen(fd, 8) < 0) { sceNetSocketClose(fd); return -1; }')
          text = text.replace('int client = accept(listener, (struct sockaddr *)&peer, &peer_len);', 'int client = sceNetAccept(listener, (OrbisNetSockaddr *)&peer, (OrbisNetSocklen_t *)&peer_len);')
          text = text.replace('setsockopt(client, SOL_SOCKET, SO_RCVTIMEO, &tv, sizeof(tv));', 'sceNetSetsockopt(client, SOL_SOCKET, SO_RCVTIMEO, &tv, sizeof(tv));')
          text = text.replace('setsockopt(client, SOL_SOCKET, SO_SNDTIMEO, &tv, sizeof(tv));', 'sceNetSetsockopt(client, SOL_SOCKET, SO_SNDTIMEO, &tv, sizeof(tv));')
          text = text.replace('close(client);', 'sceNetSocketClose(client);')
          text = text.replace('close(listener);', 'sceNetSocketClose(listener);')
          text = text.replace('        if (n < 0) {\n            if (errno == EINTR) continue;\n            return -1;\n        }', '        if (n < 0) return -1;')
          text = text.replace('        if (client < 0) {\n            if (errno == EINTR) continue;\n            break;\n        }', '        if (client < 0) break;')
          text = text.replace('        if (client < 0) {\n            if (errno == EINTR) continue;\n            sleep(1);\n            continue;\n        }', '        if (client < 0) {\n            sleep(1);\n            continue;\n        }')
          source.write_text(text)

          assert 'VERSION     := 1.01' in makefile.read_text()
          assert 'RUNTIME_MODULES' in makefile.read_text()
          assert 'RECEIVER_VERSION "1.0.1"' in source.read_text()
          assert 'socket(AF_INET' not in source.read_text()
          assert 'accept(listener' not in source.read_text()
          assert 'send(fd, p' not in source.read_text()
          PY
          grep -q 'VERSION     := 1.01' ps4receiver/Makefile
          grep -q 'sceNetSocket("tayson_receiver"' ps4receiver/receiver/main.c
          grep -q 'sceNetAccept' ps4receiver/receiver/main.c

      - name: Install OpenOrbis PS4 Toolchain 0.5.4
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v ld.lld >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y lld
          fi
          curl -fL --retry 3 --retry-delay 3 \
            -o /tmp/openorbis-toolchain.tar.gz \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz
          echo '3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  /tmp/openorbis-toolchain.tar.gz' | sha256sum -c -
          rm -rf /tmp/openorbis
          mkdir -p /tmp/openorbis
          tar -xzf /tmp/openorbis-toolchain.tar.gz -C /tmp/openorbis
          LINKX="$(find /tmp/openorbis -type f -name link.x -print -quit)"
          test -n "$LINKX"
          TOOLROOT="$(dirname "$LINKX")"
          echo "OO_PS4_TOOLCHAIN=$TOOLROOT" >> "$GITHUB_ENV"
          test -x "$TOOLROOT/bin/linux/create-fself"
          test -x "$TOOLROOT/bin/linux/PkgTool.Core"
          test -x "$TOOLROOT/bin/linux/create-gp4"

      - name: Add OpenOrbis runtime modules
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/TaysonPS4Suite-1.0.1
          mkdir -p ps4receiver/sce_module ps4receiver/sce_sys/about
          for module in libc.prx libSceFios2.prx; do
            src="$(find "$OO_PS4_TOOLCHAIN" -type f -name "$module" -print -quit)"
            test -n "$src"
            cp "$src" "ps4receiver/sce_module/$module"
          done
          right="$(find "$OO_PS4_TOOLCHAIN" -type f -name 'right.sprx' -print -quit || true)"
          if [ -n "$right" ]; then
            cp "$right" ps4receiver/sce_sys/about/right.sprx
          fi
          test -s ps4receiver/sce_module/libc.prx
          test -s ps4receiver/sce_module/libSceFios2.prx
          find ps4receiver/sce_module ps4receiver/sce_sys/about -maxdepth 1 -type f -printf '%p %s bytes\n'

      - name: Build Receiver 1.0.1
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/TaysonPS4Suite-1.0.1
          make -C ps4receiver clean pkg.gp4 2>&1 | tee receiver-build-1.0.1.log
          test -s ps4receiver/eboot.bin
          test -s ps4receiver/pkg.gp4
          grep -q 'sce_module/libc.prx' ps4receiver/pkg.gp4
          grep -q 'sce_module/libSceFios2.prx' ps4receiver/pkg.gp4
          docker run --rm \
            -v /tmp/openorbis/OpenOrbis/PS4Toolchain:/oo:ro \
            -v /tmp/TaysonPS4Suite-1.0.1/ps4receiver:/work \
            -w /work ubuntu:20.04 \
            bash -lc 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libssl1.1 libicu66 zlib1g libcurl4 ca-certificates >/dev/null && /oo/bin/linux/PkgTool.Core pkg_build pkg.gp4 .'
          test -s ps4receiver/IV0000-TYRC00001_00-TAYSONRECEIVER00.pkg
          sha256sum ps4receiver/IV0000-TYRC00001_00-TAYSONRECEIVER00.pkg ps4receiver/eboot.bin

      - name: Prepare Receiver 1.0.1 artifacts
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/TaysonPS4Suite-1.0.1
          mkdir -p dist
          cp ps4receiver/IV0000-TYRC00001_00-TAYSONRECEIVER00.pkg dist/Tayson-PS4-Receiver-1.0.1.pkg
          cp ps4receiver/eboot.bin dist/Tayson-PS4-Receiver-1.0.1-eboot.bin
          cp receiver-build-1.0.1.log dist/
          tar -czf dist/TaysonPS4Suite-1.0.1-source.tar.gz \
            --exclude='./dist' --exclude='./app/build' --exclude='./.gradle' .
          (
            cd dist
            sha256sum Tayson-PS4-Receiver-1.0.1.pkg Tayson-PS4-Receiver-1.0.1-eboot.bin TaysonPS4Suite-1.0.1-source.tar.gz > SHA256SUMS.txt
          )

      - name: Upload Receiver 1.0.1
        uses: actions/upload-artifact@v4
        with:
          name: Tayson-PS4-Receiver-1.0.1
          path: /tmp/TaysonPS4Suite-1.0.1/dist/*
          if-no-files-found: error
          retention-days: 30
