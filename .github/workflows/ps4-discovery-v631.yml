name: PS4 DDP Discovery v6.3.1 Checks

on:
  push:
    branches:
      - feature/ps4-v6.3.1-discovery-unicast-diagnostics
  pull_request:
    paths:
      - 'tools/ps4-v63/tests/**'
      - 'payload-generator/3.2.0/UPDATE/src/Ps4Discovery.cs'
      - 'payload-generator/3.2.0/UPDATE/src/Ps4LanAddressPolicy.cs'
      - '.github/workflows/ps4-discovery-v631.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Independent DDP wire and UDP loopback checks
        run: python3 tools/ps4-v63/tests/test_ddp_wire.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile and run PS4 discovery C# checks
        run: dotnet run --project tools/ps4-v63/tests/DiscoveryTests.csproj -c Release --no-launch-profile

# No keystore, Android signing, PS4 communication or production deployment.
