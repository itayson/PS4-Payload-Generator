name: Android auto-send safety checks

on:
  push:
    branches:
      - 'fix/auto-send-*'
    paths:
      - 'payload-generator/3.2.0/UPDATE/src/UiAutoPipeline.cs'
      - 'scripts/test_ui_auto_send_contract.py'
      - '.github/workflows/auto-send-safety.yml'
  pull_request:
    branches: [main]
    paths:
      - 'payload-generator/3.2.0/UPDATE/src/UiAutoPipeline.cs'
      - 'scripts/test_ui_auto_send_contract.py'
      - '.github/workflows/auto-send-safety.yml'

permissions:
  contents: read

jobs:
  static-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check auto-send safety invariants
        run: python3 scripts/test_ui_auto_send_contract.py
