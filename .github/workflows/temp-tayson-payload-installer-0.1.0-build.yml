name: Temporary Tayson Payload Installer 0.2.0 Build

on:
  push:
    branches:
      - build/tayson-autopilot-1.3.0

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout PS4 Payload SDK
        uses: actions/checkout@v4
        with:
          repository: ps4-payload-dev/sdk
          path: payload-sdk

      - name: Build and install PS4 Payload SDK
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y clang-18 lld-18 llvm-18 make patch
          make -C payload-sdk DESTDIR=/tmp/ps4-payload-sdk clean install
          echo "PS4_PAYLOAD_SDK=/tmp/ps4-payload-sdk" >> "$GITHUB_ENV"
          echo "LLVM_CONFIG=$(command -v llvm-config-18)" >> "$GITHUB_ENV"

      - name: Apply Payload 0.2.0 Autopilot patches
        shell: bash
        run: |
          set -euxo pipefail
          python3 ci011/apply_payload011.py
          python3 ci012/apply_payload012.py
          sed -i 's/Tayson-Payload-Installer-0.1.0/Tayson-Payload-Installer-0.2.0/' payload-installer/Makefile
          python3 ci020/apply_payload020.py
          grep -q 'TAYSON_PAYLOAD_VERSION "0.2.0"' payload-installer/main.c
          grep -q 'TAYSONP/1 DIRECTRESUME' payload-installer/main.c
          grep -q 'download_direct' payload-installer/main.c
          grep -q 'CACHE_META' payload-installer/main.c
          grep -q 'PAYLOAD_WORKER_STACK' payload-installer/main.c

      - name: Build payload ELF and BIN
        shell: bash
        run: |
          set -euxo pipefail
          cd payload-installer
          make clean all
          test -s Tayson-Payload-Installer-0.2.0.elf
          test -s Tayson-Payload-Installer-0.2.0.bin
          file Tayson-Payload-Installer-0.2.0.elf | tee build-info.txt
          file Tayson-Payload-Installer-0.2.0.bin | tee -a build-info.txt
          strings Tayson-Payload-Installer-0.2.0.elf | grep -q 'Tayson Payload Installer 0.2.0'
          strings Tayson-Payload-Installer-0.2.0.elf | grep -q 'TAYSONP/1 DIRECTRESUME'
          strings Tayson-Payload-Installer-0.2.0.elf | grep -q 'sceHttpCreateRequestWithURL'
          strings Tayson-Payload-Installer-0.2.0.elf | grep -q 'sceAppInstUtilAppInstallPkg'

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/tayson-payload-020
          cp payload-installer/Tayson-Payload-Installer-0.2.0.elf /tmp/tayson-payload-020/
          cp payload-installer/Tayson-Payload-Installer-0.2.0.bin /tmp/tayson-payload-020/
          cp payload-installer/README.md payload-installer/build-info.txt /tmp/tayson-payload-020/
          tar -czf /tmp/tayson-payload-020/Tayson-Payload-Installer-0.2.0-source.tar.gz payload-installer ci011 ci012 ci020
          (cd /tmp/tayson-payload-020 && sha256sum Tayson-Payload-Installer-0.2.0.elf Tayson-Payload-Installer-0.2.0.bin Tayson-Payload-Installer-0.2.0-source.tar.gz > SHA256SUMS.txt)

      - name: Upload payload installer
        uses: actions/upload-artifact@v4
        with:
          name: Tayson-Payload-Installer-0.2.0
          path: /tmp/tayson-payload-020/*
          if-no-files-found: error
          retention-days: 30
