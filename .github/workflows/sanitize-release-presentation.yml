name: Sanitize release presentation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sanitize-release-presentation.yml

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Minimize stable release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail

          cat > /tmp/stable.md <<'EOF'
          # Tayson PS4 Payload Generator 3.4.3

          Versão estável validada em hardware real.

          Inclui:
          - aplicativo Android;
          - Worker complementar;
          - arquivo de checksums.

          Compatível com os provedores suportados pelo projeto.

          Detalhes internos de infraestrutura e transporte são omitidos da documentação pública.

          Uso destinado a desenvolvimento, homebrew, testes e gerenciamento de conteúdo autorizado.
          EOF

          gh release edit v3.4.3 \
            --repo "$GITHUB_REPOSITORY" \
            --title 'Tayson PS4 Payload Generator 3.4.3' \
            --notes-file /tmp/stable.md \
            --latest

      - name: Hide historical test releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail

          for TAG in \
            v3.4.1-provider-routes-test \
            v3.4.2-filek-context-test \
            v3.4.3-filek-dlproxy-test \
            worker-v11.3-akira-hotfix-test
          do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release edit "$TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --title 'Internal test build' \
                --notes 'Internal test build. Superseded or pending validation.' \
                --draft
            fi
          done
