name: Build TaySon Proxy Lab APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'native-proxy-lab/**'
      - '.github/workflows/native-proxy-lab.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        run: gradle -p native-proxy-lab :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TaySon-Proxy-Lab-APK
          path: native-proxy-lab/app/build/outputs/apk/debug/*.apk
