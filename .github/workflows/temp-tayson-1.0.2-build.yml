name: Temporary Tayson PS4 Receiver 1.0.2 Build

on:
  push:
    branches:
      - build/tayson-ps4-suite-1.0.2

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore Suite 1.0.0 source
        shell: bash
        run: |
          set -euxo pipefail
          cat ci100/chunk00 ci100/chunk01 ci100/chunk02 ci100/chunk03 ci100/chunk04 ci100/chunk05 ci100/chunk06 ci100/chunk07 \
            | base64 --decode > /tmp/TaysonPS4Suite-1.0.0-source.tar.gz
          echo 'e0699edd368c3ab4529ab17348538f264abae97717a4da2cf876a4123f5def1b  /tmp/TaysonPS4Suite-1.0.0-source.tar.gz' | sha256sum -c -
          rm -rf /tmp/TaysonPS4Suite-1.0.2
          mkdir -p /tmp/TaysonPS4Suite-1.0.2
          tar -xzf /tmp/TaysonPS4Suite-1.0.0-source.tar.gz -C /tmp/TaysonPS4Suite-1.0.2 --strip-components=1
          test -f /tmp/TaysonPS4Suite-1.0.2/ps4receiver/receiver/main.c

      - name: Apply Receiver 1.0.2 runtime and PS4 socket ABI fixes
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/TaysonPS4Suite-1.0.2
          python3 - <<'PY'
          from pathlib import Path

          makefile = Path('ps4receiver/Makefile')
          m = makefile.read_text()
          m = m.replace('VERSION     := 1.00', 'VERSION     := 1.02')
          m = m.replace(
              'pkg.gp4: eboot.bin sce_sys/param.sfo sce_sys/icon0.png\n\t$(TOOLCHAIN)/bin/$(CDIR)/create-gp4 -out $@ --content-id=$(CONTENT_ID) --files "$^"',
              'RUNTIME_MODULES := $(wildcard sce_module/*.prx)\nEXTRA_PACKAGE_FILES := $(wildcard sce_sys/about/*.sprx)\n\npkg.gp4: eboot.bin sce_sys/param.sfo sce_sys/icon0.png $(RUNTIME_MODULES) $(EXTRA_PACKAGE_FILES)\n\t$(TOOLCHAIN)/bin/$(CDIR)/create-gp4 -out $@ --content-id=$(CONTENT_ID) --files "$^"'
          )
          makefile.write_text(m)

          source = Path('ps4receiver/receiver/main.c')
          text = source.read_text()
          text = text.replace('#define RECEIVER_VERSION "1.0.0"', '#define RECEIVER_VERSION "1.0.2"')
          text = text.replace('Tayson PS4 Receiver 1.0 iniciando', 'Tayson PS4 Receiver 1.0.2 iniciando')
          text = text.replace('Tayson PS4 Receiver 1.0 ativo - porta 9095', 'Tayson PS4 Receiver 1.0.2 ativo - porta 9095')
          text = text.replace('ntohl(', 'sceNetNtohl(')
          text = text.replace('htons(', 'sceNetHtons(')
          text = text.replace('htonl(', 'sceNetHtonl(')
          text = text.replace('send(fd, p, len, 0)', 'sceNetSend(fd, p, len, 0)')
          text = text.replace('recv(fd, p, len, 0)', 'sceNetRecv(fd, p, len, 0)')
          text = text.replace('recv(fd, &c, 1, 0)', 'sceNetRecv(fd, &c, 1, 0)')
          text = text.replace('recv(client, header + used, MAX_REQUEST_HEADER - used, 0)', 'sceNetRecv(client, header + used, MAX_REQUEST_HEADER - used, 0)')
          text = text.replace('int fd = socket(AF_INET, SOCK_STREAM, 0);', 'int fd = sceNetSocket("tayson_receiver", ORBIS_NET_AF_INET, ORBIS_NET_SOCK_STREAM, 0);')
          text = text.replace('if (bind(fd, (struct sockaddr *)&addr, sizeof(addr)) < 0) { close(fd); return -1; }', 'if (sceNetBind(fd, (const OrbisNetSockaddr *)&addr, sizeof(addr)) < 0) { sceNetSocketClose(fd); return -1; }')
          text = text.replace('if (listen(fd, 8) < 0) { close(fd); return -1; }', 'if (sceNetListen(fd, 8) < 0) { sceNetSocketClose(fd); return -1; }')
          text = text.replace('close(client);', 'sceNetSocketClose(client);')
          text = text.replace('close(listener);', 'sceNetSocketClose(listener);')
          text = text.replace('        if (n < 0) {\n            if (errno == EINTR) continue;\n            return -1;\n        }', '        if (n < 0) return -1;')
          text = text.replace('        if (client < 0) {\n            if (errno == EINTR) continue;\n            break;\n        }', '        if (client < 0) break;')
          text = text.replace('        if (client < 0) {\n            if (errno == EINTR) continue;\n            sleep(1);\n            continue;\n        }', '        if (client < 0) {\n            sleep(1);\n            continue;\n        }')

          marker = '#define ORBIS_KERNEL_PRIO_FIFO_NORMAL 0x2BC\n'
          abi = (
              '#define ORBIS_KERNEL_PRIO_FIFO_NORMAL 0x2BC\n\n'
              '/* PS4 libSceNet socket ABI. */\n'
              '#define RECEIVER_NET_SOL_SOCKET 0xFFFF\n'
              '#define RECEIVER_NET_SO_REUSEADDR 0x00000004\n'
              '#define RECEIVER_NET_SO_SNDTIMEO 0x1105\n'
              '#define RECEIVER_NET_SO_RCVTIMEO 0x1106\n\n'
              'typedef struct {\n'
              '    uint8_t sin_len;\n'
              '    uint8_t sin_family;\n'
              '    uint16_t sin_port;\n'
              '    uint32_t sin_addr;\n'
              '    uint16_t sin_vport;\n'
              '    char sin_zero[6];\n'
              '} receiver_net_sockaddr_in;\n'
          )
          if marker not in text:
              raise SystemExit('ABI insertion marker not found')
          text = text.replace(marker, abi, 1)

          old_listener = (
              '    int yes = 1;\n'
              '    setsockopt(fd, SOL_SOCKET, SO_REUSEADDR, &yes, sizeof(yes));\n'
              '    struct sockaddr_in addr;\n'
              '    memset(&addr, 0, sizeof(addr));\n'
              '    addr.sin_family = AF_INET;\n'
              '    addr.sin_port = sceNetHtons(port);\n'
              '    addr.sin_addr.s_addr = sceNetHtonl(bind_addr);'
          )
          new_listener = (
              '    int yes = 1;\n'
              '    sceNetSetsockopt(fd, RECEIVER_NET_SOL_SOCKET, RECEIVER_NET_SO_REUSEADDR, &yes, sizeof(yes));\n'
              '    receiver_net_sockaddr_in addr;\n'
              '    memset(&addr, 0, sizeof(addr));\n'
              '    addr.sin_len = (uint8_t)sizeof(addr);\n'
              '    addr.sin_family = ORBIS_NET_AF_INET;\n'
              '    addr.sin_port = sceNetHtons(port);\n'
              '    addr.sin_addr = sceNetHtonl(bind_addr);'
          )
          if old_listener not in text:
              raise SystemExit('listener block not found')
          text = text.replace(old_listener, new_listener, 1)

          old_accept = (
              '        struct sockaddr_in peer;\n'
              '        socklen_t peer_len = sizeof(peer);\n'
              '        int client = accept(listener, (struct sockaddr *)&peer, &peer_len);'
          )
          new_accept = (
              '        receiver_net_sockaddr_in peer;\n'
              '        OrbisNetSocklen_t peer_len = sizeof(peer);\n'
              '        int client = sceNetAccept(listener, (OrbisNetSockaddr *)&peer, &peer_len);'
          )
          if text.count(old_accept) != 2:
              raise SystemExit(f'expected 2 accept blocks, found {text.count(old_accept)}')
          text = text.replace(old_accept, new_accept)
          text = text.replace('peer.sin_addr.s_addr', 'peer.sin_addr')
          text = text.replace('const struct sockaddr_in *peer', 'const receiver_net_sockaddr_in *peer')

          old_timeout = (
              '    struct timeval tv = { .tv_sec = 15, .tv_usec = 0 };\n'
              '    setsockopt(client, SOL_SOCKET, SO_RCVTIMEO, &tv, sizeof(tv));\n'
              '    setsockopt(client, SOL_SOCKET, SO_SNDTIMEO, &tv, sizeof(tv));'
          )
          new_timeout = (
              '    int timeout_us = 15 * 1000 * 1000;\n'
              '    sceNetSetsockopt(client, RECEIVER_NET_SOL_SOCKET, RECEIVER_NET_SO_RCVTIMEO, &timeout_us, sizeof(timeout_us));\n'
              '    sceNetSetsockopt(client, RECEIVER_NET_SOL_SOCKET, RECEIVER_NET_SO_SNDTIMEO, &timeout_us, sizeof(timeout_us));'
          )
          if old_timeout not in text:
              raise SystemExit('timeout block not found')
          text = text.replace(old_timeout, new_timeout, 1)
          source.write_text(text)

          final = source.read_text()
          assert 'RECEIVER_VERSION "1.0.2"' in final
          assert 'receiver_net_sockaddr_in' in final
          assert 'sin_len = (uint8_t)sizeof(addr)' in final
          assert 'RECEIVER_NET_SOL_SOCKET 0xFFFF' in final
          assert 'RECEIVER_NET_SO_RCVTIMEO 0x1106' in final
          assert 'int timeout_us = 15 * 1000 * 1000;' in final
          assert 'struct timeval tv' not in final
          assert 'socket(AF_INET' not in final
          assert 'accept(listener' not in final
          assert 'send(fd, p' not in final
          assert 'VERSION     := 1.02' in makefile.read_text()
          assert 'RUNTIME_MODULES' in makefile.read_text()
          PY

      - name: Install OpenOrbis PS4 Toolchain 0.5.4
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v ld.lld >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y lld
          fi
          curl -fL --retry 3 --retry-delay 3 \
            -o /tmp/openorbis-toolchain.tar.gz \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz
          echo '3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  /tmp/openorbis-toolchain.tar.gz' | sha256sum -c -
          rm -rf /tmp/openorbis
          mkdir -p /tmp/openorbis
          tar -xzf /tmp/openorbis-toolchain.tar.gz -C /tmp/openorbis
          LINKX="$(find /tmp/openorbis -type f -name link.x -print -quit)"
          test -n "$LINKX"
          TOOLROOT="$(dirname "$LINKX")"
          echo "OO_PS4_TOOLCHAIN=$TOOLROOT" >> "$GITHUB_ENV"
          test -x "$TOOLROOT/bin/linux/create-fself"
          test -x "$TOOLROOT/bin/linux/PkgTool.Core"
          test -x "$TOOLROOT/bin/linux/create-gp4"

      - name: Add OpenOrbis runtime modules
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/TaysonPS4Suite-1.0.2
          mkdir -p ps4receiver/sce_module ps4receiver/sce_sys/about
          for module in libc.prx libSceFios2.prx; do
            src="$(find "$OO_PS4_TOOLCHAIN" -type f -name "$module" -print -quit)"
            test -n "$src"
            cp "$src" "ps4receiver/sce_module/$module"
          done
          right="$(find "$OO_PS4_TOOLCHAIN" -type f -name 'right.sprx' -print -quit || true)"
          if [ -n "$right" ]; then
            cp "$right" ps4receiver/sce_sys/about/right.sprx
          fi
          test -s ps4receiver/sce_module/libc.prx
          test -s ps4receiver/sce_module/libSceFios2.prx

      - name: Build Receiver 1.0.2
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/TaysonPS4Suite-1.0.2
          make -C ps4receiver clean pkg.gp4 2>&1 | tee receiver-build-1.0.2.log
          test -s ps4receiver/eboot.bin
          test -s ps4receiver/pkg.gp4
          grep -q 'sce_module/libc.prx' ps4receiver/pkg.gp4
          grep -q 'sce_module/libSceFios2.prx' ps4receiver/pkg.gp4
          docker run --rm \
            -v /tmp/openorbis/OpenOrbis/PS4Toolchain:/oo:ro \
            -v /tmp/TaysonPS4Suite-1.0.2/ps4receiver:/work \
            -w /work ubuntu:20.04 \
            bash -lc 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libssl1.1 libicu66 zlib1g libcurl4 ca-certificates >/dev/null && /oo/bin/linux/PkgTool.Core pkg_build pkg.gp4 .'
          test -s ps4receiver/IV0000-TYRC00001_00-TAYSONRECEIVER00.pkg
          sha256sum ps4receiver/IV0000-TYRC00001_00-TAYSONRECEIVER00.pkg ps4receiver/eboot.bin

      - name: Prepare Receiver 1.0.2 artifacts
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/TaysonPS4Suite-1.0.2
          mkdir -p dist
          cp ps4receiver/IV0000-TYRC00001_00-TAYSONRECEIVER00.pkg dist/Tayson-PS4-Receiver-1.0.2.pkg
          cp ps4receiver/eboot.bin dist/Tayson-PS4-Receiver-1.0.2-eboot.bin
          cp receiver-build-1.0.2.log dist/
          tar -czf dist/TaysonPS4Suite-1.0.2-source.tar.gz \
            --exclude='./dist' --exclude='./app/build' --exclude='./.gradle' .
          (
            cd dist
            sha256sum Tayson-PS4-Receiver-1.0.2.pkg Tayson-PS4-Receiver-1.0.2-eboot.bin TaysonPS4Suite-1.0.2-source.tar.gz > SHA256SUMS.txt
          )

      - name: Upload Receiver 1.0.2
        uses: actions/upload-artifact@v4
        with:
          name: Tayson-PS4-Receiver-1.0.2
          path: /tmp/TaysonPS4Suite-1.0.2/dist/*
          if-no-files-found: error
          retention-days: 30
