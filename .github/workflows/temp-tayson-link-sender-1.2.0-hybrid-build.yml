name: Temporary Tayson Link Sender 1.2.0 Hybrid Build

on:
  push:
    branches:
      - build/tayson-hybrid-payload-0.1.0

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout hybrid project
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore validated Link Sender 1.1.0 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          curl -fL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o /tmp/suite110.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10282012224/zip"
          rm -rf /tmp/suite110 /tmp/TaysonHybrid-1.2.0
          mkdir -p /tmp/suite110 /tmp/TaysonHybrid-1.2.0
          unzip -q /tmp/suite110.zip -d /tmp/suite110
          test -s /tmp/suite110/TaysonPS4Suite-1.1.0-source.tar.gz
          tar -xzf /tmp/suite110/TaysonPS4Suite-1.1.0-source.tar.gz \
            -C /tmp/TaysonHybrid-1.2.0 --strip-components=1
          test -f /tmp/TaysonHybrid-1.2.0/app/src/main/java/com/tayson/ps4linksender/MainActivity.kt

      - name: Overlay Relay and Payload Android clients
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          cd /tmp/TaysonHybrid-1.2.0
          mkdir -p app/src/main/java/com/tayson/ps4linksender/relay
          mkdir -p app/src/main/java/com/tayson/ps4linksender/ps4
          cp "$GITHUB_WORKSPACE"/app/src/main/java/com/tayson/ps4linksender/relay/*.kt \
            app/src/main/java/com/tayson/ps4linksender/relay/
          cp "$GITHUB_WORKSPACE"/app/src/main/java/com/tayson/ps4linksender/ps4/PayloadClient.kt \
            app/src/main/java/com/tayson/ps4linksender/ps4/
          cp "$GITHUB_WORKSPACE"/app/src/main/java/com/tayson/ps4linksender/ps4/PayloadLoaderClient.kt \
            app/src/main/java/com/tayson/ps4linksender/ps4/

          curl -fL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o /tmp/payload010.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10298596002/zip"
          rm -rf /tmp/payload010
          mkdir -p /tmp/payload010 app/src/main/assets
          unzip -q /tmp/payload010.zip -d /tmp/payload010
          test -s /tmp/payload010/Tayson-Payload-Installer-0.1.0.bin
          cp /tmp/payload010/Tayson-Payload-Installer-0.1.0.bin \
            app/src/main/assets/tayson_payload_installer_0_1_0.bin

      - name: Apply Hybrid 1.2.0 UI and Relay patch
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/TaysonHybrid-1.2.0
          python3 "$GITHUB_WORKSPACE/ci120hybrid/apply_android_hybrid120.py"
          sed -i '/android.permission.ACCESS_NETWORK_STATE/a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' app/src/main/AndroidManifest.xml
          grep -q 'versionCode = 17' app/build.gradle.kts
          grep -q 'versionName = "1.2.0"' app/build.gradle.kts
          grep -q 'ENVIAR VIA PAYLOAD LOCAL' app/src/main/java/com/tayson/ps4linksender/MainActivity.kt
          grep -q 'PayloadLoaderClient.sendEmbedded' app/src/main/java/com/tayson/ps4linksender/MainActivity.kt
          grep -q 'RelayManager.prepare' app/src/main/java/com/tayson/ps4linksender/MainActivity.kt
          grep -q 'android.permission.POST_NOTIFICATIONS' app/src/main/AndroidManifest.xml
          grep -q 'foregroundServiceType="connectedDevice"' app/src/main/AndroidManifest.xml
          test -s app/src/main/assets/tayson_payload_installer_0_1_0.bin

      - name: Lint and build Android 1.2.0 Hybrid
        shell: bash
        run: |
          set -o pipefail
          cd /tmp/TaysonHybrid-1.2.0
          gradle --no-daemon :app:lintUniversalDebug :app:assembleUniversalDebug \
            2>&1 | tee android-build-1.2.0-hybrid.log
          test -s app/build/outputs/apk/universal/debug/app-universal-debug.apk

      - name: Prepare Hybrid artifacts
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/TaysonHybrid-1.2.0
          mkdir -p dist
          cp app/build/outputs/apk/universal/debug/app-universal-debug.apk \
            dist/Tayson-PS4-Link-Sender-1.2.0-Hybrid-universal-debug.apk
          cp /tmp/payload010/Tayson-Payload-Installer-0.1.0.bin dist/
          cp /tmp/payload010/Tayson-Payload-Installer-0.1.0.elf dist/
          cp android-build-1.2.0-hybrid.log dist/
          tar -czf dist/TaysonPS4LinkSender-1.2.0-Hybrid-source.tar.gz \
            --exclude='./dist' --exclude='./app/build' --exclude='./.gradle' .
          (cd dist && sha256sum \
            Tayson-PS4-Link-Sender-1.2.0-Hybrid-universal-debug.apk \
            Tayson-Payload-Installer-0.1.0.bin \
            Tayson-Payload-Installer-0.1.0.elf \
            TaysonPS4LinkSender-1.2.0-Hybrid-source.tar.gz > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload Hybrid 1.2.0
        uses: actions/upload-artifact@v4
        with:
          name: Tayson-PS4-Link-Sender-1.2.0-Hybrid
          path: /tmp/TaysonHybrid-1.2.0/dist/*
          if-no-files-found: error
          retention-days: 30
