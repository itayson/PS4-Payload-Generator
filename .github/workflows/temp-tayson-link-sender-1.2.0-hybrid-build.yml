name: Temporary Tayson Link Sender 1.3.0 Autopilot Build

on:
  push:
    branches:
      - build/tayson-autopilot-1.3.0

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Autopilot project
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore validated Link Sender 1.1.0 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          curl -fL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o /tmp/suite110.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10282012224/zip"
          rm -rf /tmp/suite110 /tmp/TaysonAutopilot-1.3.0
          mkdir -p /tmp/suite110 /tmp/TaysonAutopilot-1.3.0
          unzip -q /tmp/suite110.zip -d /tmp/suite110
          test -s /tmp/suite110/TaysonPS4Suite-1.1.0-source.tar.gz
          tar -xzf /tmp/suite110/TaysonPS4Suite-1.1.0-source.tar.gz -C /tmp/TaysonAutopilot-1.3.0 --strip-components=1

      - name: Overlay transport clients and Payload 0.2.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          cd /tmp/TaysonAutopilot-1.3.0
          mkdir -p app/src/main/java/com/tayson/ps4linksender/relay
          mkdir -p app/src/main/java/com/tayson/ps4linksender/ps4
          cp "$GITHUB_WORKSPACE"/app/src/main/java/com/tayson/ps4linksender/relay/*.kt app/src/main/java/com/tayson/ps4linksender/relay/
          cp "$GITHUB_WORKSPACE"/app/src/main/java/com/tayson/ps4linksender/ps4/PayloadClient.kt app/src/main/java/com/tayson/ps4linksender/ps4/
          cp "$GITHUB_WORKSPACE"/app/src/main/java/com/tayson/ps4linksender/ps4/PayloadLoaderClient.kt app/src/main/java/com/tayson/ps4linksender/ps4/
          cp "$GITHUB_WORKSPACE"/app/src/main/java/com/tayson/ps4linksender/ps4/AutoPilotEngine.kt app/src/main/java/com/tayson/ps4linksender/ps4/

          curl -fL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o /tmp/payload020.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10300473830/zip"
          rm -rf /tmp/payload020
          mkdir -p /tmp/payload020 app/src/main/assets
          unzip -q /tmp/payload020.zip -d /tmp/payload020
          test -s /tmp/payload020/Tayson-Payload-Installer-0.2.0.bin
          test -s /tmp/payload020/Tayson-Payload-Installer-0.2.0.elf
          cp /tmp/payload020/Tayson-Payload-Installer-0.2.0.bin app/src/main/assets/tayson_payload_installer_0_2_0.bin

          # The historical 1.2.x patch chain validates its intermediate asset names.
          # Temporarily restore the 0.1.0 name; the final Autopilot client is copied back below.
          sed -i 's/tayson_payload_installer_0_2_0.bin/tayson_payload_installer_0_1_0.bin/' app/src/main/java/com/tayson/ps4linksender/ps4/PayloadLoaderClient.kt

      - name: Apply 1.2.x compatibility patches
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/TaysonAutopilot-1.3.0
          python3 "$GITHUB_WORKSPACE/ci120hybrid/apply_android_hybrid120.py"
          sed -i '/android.permission.ACCESS_NETWORK_STATE/a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' app/src/main/AndroidManifest.xml
          python3 "$GITHUB_WORKSPACE/ci121hybrid/apply_android_hybrid121.py"
          python3 "$GITHUB_WORKSPACE/ci122hybrid/apply_android_hybrid122.py"
          grep -q 'versionName = "1.2.2"' app/build.gradle.kts
          grep -q 'RETOMAR CACHE EXISTENTE' app/src/main/java/com/tayson/ps4linksender/MainActivity.kt

      - name: Apply Link Sender 1.3.0 Autopilot
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/TaysonAutopilot-1.3.0
          cp "$GITHUB_WORKSPACE"/app/src/main/java/com/tayson/ps4linksender/ps4/PayloadLoaderClient.kt app/src/main/java/com/tayson/ps4linksender/ps4/PayloadLoaderClient.kt
          python3 "$GITHUB_WORKSPACE/ci130auto/apply_android_autopilot130.py"
          grep -q 'versionCode = 20' app/build.gradle.kts
          grep -q 'versionName = "1.3.0"' app/build.gradle.kts
          grep -q 'AutoPilotEngine.run' app/src/main/java/com/tayson/ps4linksender/MainActivity.kt
          grep -q 'PAYLOAD_DIRECT' app/src/main/java/com/tayson/ps4linksender/ps4/AutoPilotEngine.kt
          grep -q 'DIRECTRESUME' app/src/main/java/com/tayson/ps4linksender/ps4/PayloadClient.kt
          grep -q 'tayson_payload_installer_0_2_0.bin' app/src/main/java/com/tayson/ps4linksender/ps4/PayloadLoaderClient.kt
          test -s app/src/main/assets/tayson_payload_installer_0_2_0.bin

      - name: Lint and build Android 1.3.0 Autopilot
        shell: bash
        run: |
          set -o pipefail
          cd /tmp/TaysonAutopilot-1.3.0
          gradle --no-daemon :app:lintUniversalDebug :app:assembleUniversalDebug 2>&1 | tee android-build-1.3.0-autopilot.log
          test -s app/build/outputs/apk/universal/debug/app-universal-debug.apk

      - name: Prepare Autopilot artifacts
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/TaysonAutopilot-1.3.0
          mkdir -p dist
          cp app/build/outputs/apk/universal/debug/app-universal-debug.apk dist/Tayson-PS4-Link-Sender-1.3.0-Autopilot-universal-debug.apk
          cp /tmp/payload020/Tayson-Payload-Installer-0.2.0.bin dist/
          cp /tmp/payload020/Tayson-Payload-Installer-0.2.0.elf dist/
          cp android-build-1.3.0-autopilot.log dist/
          tar -czf dist/TaysonPS4LinkSender-1.3.0-Autopilot-source.tar.gz --exclude='./dist' --exclude='./app/build' --exclude='./.gradle' .
          (cd dist && sha256sum Tayson-PS4-Link-Sender-1.3.0-Autopilot-universal-debug.apk Tayson-Payload-Installer-0.2.0.bin Tayson-Payload-Installer-0.2.0.elf TaysonPS4LinkSender-1.3.0-Autopilot-source.tar.gz > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload Link Sender 1.3.0 Autopilot
        uses: actions/upload-artifact@v4
        with:
          name: Tayson-PS4-Link-Sender-1.3.0-Autopilot
          path: /tmp/TaysonAutopilot-1.3.0/dist/*
          if-no-files-found: error
          retention-days: 30
