name: Promote Tayson 3.4.3 stable release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/promote-3.4.3-stable.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download validated prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/tayson-343
          BASE='https://github.com/itayson/PS4-Payload-Generator/releases/download/v3.4.3-filek-dlproxy-test'
          curl -fL "$BASE/PS4-Payload-Generator-3.4.3-TaySon.apk" \
            -o /tmp/tayson-343/PS4-Payload-Generator-3.4.3-TaySon.apk
          curl -fL "$BASE/universal_transport_worker_v11_2.js" \
            -o /tmp/tayson-343/universal_transport_worker_v11_2.js
          curl -fL "$BASE/SHA256SUMS.txt" \
            -o /tmp/tayson-343/SHA256SUMS.txt
          ls -lh /tmp/tayson-343
          cd /tmp/tayson-343
          echo '88e340f6db250c20506e570832c7a3ba9800181dd4390e372b022bae59527e6e  PS4-Payload-Generator-3.4.3-TaySon.apk' | sha256sum -c -
          test -s universal_transport_worker_v11_2.js
          test -s SHA256SUMS.txt

      - name: Write stable release notes
        shell: bash
        run: |
          cat > /tmp/tayson-343/RELEASE-NOTES.md <<'EOF'
          # Tayson PS4 Payload Generator 3.4.3

          Release estável validada em PS4 real.

          ## Destaques

          - aplicativo 3.4.3 / versionCode 40;
          - Worker v11.2;
          - Mocha por rota curta do Worker;
          - VikingFile por rota dedicada, preservando R2/SigV4;
          - FileKeeper por rota `/f/<token>.pkg`;
          - reconhecimento FileKeeper de `filekeeper.net` e `dlproxy.uk`;
          - identidade do provedor preservada até a geração do ELF;
          - Rootz e AkiraBox preservam os fluxos já validados;
          - binding Cloudflare: `ROUTES -> tayson-payload-routes`;
          - template ELF/BGFT conhecido preservado.

          ## Arquivos

          - `PS4-Payload-Generator-3.4.3-TaySon.apk`
          - `universal_transport_worker_v11_2.js`
          - `SHA256SUMS.txt`

          ## Integridade

          APK SHA-256:

          ```text
          88e340f6db250c20506e570832c7a3ba9800181dd4390e372b022bae59527e6e
          ```

          Template ELF SHA-256:

          ```text
          ec778c6b39835e6d9ee8681faf99e827b18da0148b8d8e75f0c9d85925f4b1bc
          ```

          ## Validação

          CI #300 e #301 concluídos com sucesso; 103 checks aprovados. A combinação aplicativo 3.4.3 + Worker v11.2 foi confirmada funcionando normalmente em PS4 real.

          Uso destinado a desenvolvimento, homebrew, testes e gerenciamento de conteúdo autorizado.
          EOF

      - name: Publish stable v3.4.3 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          if gh release view v3.4.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v3.4.3 \
              --repo "$GITHUB_REPOSITORY" \
              --title 'Tayson PS4 Payload Generator 3.4.3' \
              --notes-file /tmp/tayson-343/RELEASE-NOTES.md \
              --latest
            gh release upload v3.4.3 \
              --repo "$GITHUB_REPOSITORY" \
              /tmp/tayson-343/PS4-Payload-Generator-3.4.3-TaySon.apk \
              /tmp/tayson-343/universal_transport_worker_v11_2.js \
              /tmp/tayson-343/SHA256SUMS.txt \
              --clobber
          else
            gh release create v3.4.3 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'Tayson PS4 Payload Generator 3.4.3' \
              --notes-file /tmp/tayson-343/RELEASE-NOTES.md \
              --latest \
              /tmp/tayson-343/PS4-Payload-Generator-3.4.3-TaySon.apk \
              /tmp/tayson-343/universal_transport_worker_v11_2.js \
              /tmp/tayson-343/SHA256SUMS.txt
          fi
