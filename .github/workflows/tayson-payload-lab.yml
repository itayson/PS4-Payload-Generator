name: Tayson Payload Lab 1.5.0
on:
  push:
    branches: [build/tayson-ps4-suite-1.5.0]
    paths: ['suite/**', '.github/workflows/tayson-payload-lab.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install PS4 build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-18 lld-18 llvm-18 xxd
          curl -fsSL --retry 3 https://github.com/ps4-payload-dev/sdk/releases/download/v0.9/ps4-payload-sdk.zip -o /tmp/ps4-sdk.zip
          echo '3190e88255a72161e5ce2f22a8ae8f638a2c5a9d1ff1e0209ed692d36b4d9ec5  /tmp/ps4-sdk.zip' | sha256sum -c -
          unzip -q /tmp/ps4-sdk.zip -d /tmp
          echo 'PS4_PAYLOAD_SDK=/tmp/ps4-payload-sdk' >> "$GITHUB_ENV"
          echo 'LLVM_CONFIG=llvm-config-18' >> "$GITHUB_ENV"
      - name: Build loader from pinned source
        run: |
          git clone https://github.com/ps4-payload-dev/elfldr.git /tmp/tayson-elfldr
          git -C /tmp/tayson-elfldr checkout b3ee49746cb9f3464e8dc75ec6387e8408558b8a
          make -C /tmp/tayson-elfldr -j2
      - name: Test protocol and build PS4 payload
        working-directory: suite
        run: |
          bash scripts/test-core.sh
          make -C ps4payload
          python3 tools/package_payload.py /tmp/tayson-elfldr/elfldr.bin
      - name: Build and test Android
        working-directory: suite
        run: |
          gradle --no-daemon :app:testUniversalDebugUnitTest :app:lintUniversalDebug :app:assembleUniversalDebug
      - name: Package deliverables
        working-directory: suite
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/universal/debug/app-universal-debug.apk dist/Tayson-PS4-Payload-Lab-1.5.0.apk
          cp ps4payload/tayson_probe.elf dist/Tayson-PS4-Payload-Probe-1.5.0.elf
          cp /tmp/tayson-elfldr/elfldr.bin dist/PS4-ELF-Loader.bin
          cp PAYLOAD_TEST.md dist/LEIA-ME.md
          cp app/src/main/assets/payload/manifest.json dist/payload-manifest.json
          git -C /tmp/tayson-elfldr archive --format=tar.gz HEAD > dist/elfldr-b3ee497-source.tar.gz
          tar -czf dist/TaysonPS4Suite-1.5.0-source.tar.gz --exclude=./dist --exclude=./app/build --exclude=./.gradle .
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zipfile
          d=Path('dist')
          with zipfile.ZipFile(d/'Tayson-PS4-Payload-Lab-1.5.0.apk') as z:
              assert z.testzip() is None
              for n in ['tayson_probe.elf','elfldr.bin']:
                  assert z.read('assets/payload/'+n)==Path('app/src/main/assets/payload',n).read_bytes()
          (d/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(d.iterdir()) if p.is_file()))
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Tayson-PS4-Payload-Lab-1.5.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Tayson-PS4-Payload-Lab-1.5.0
          path: suite/dist/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tayson-PS4-Payload-Lab-test-reports
          path: |
            suite/app/build/reports/tests/
            suite/app/build/reports/lint-results-universalDebug.html
          if-no-files-found: ignore
