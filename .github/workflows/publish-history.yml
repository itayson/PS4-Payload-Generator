name: Publish historical Akirabox releases

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-history.yml

permissions:
  contents: write

concurrency:
  group: akirabox-release-history
  cancel-in-progress: false

jobs:
  release:
    name: Akirabox ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 1.0.0
            commit: cf644effaa592af1f457308e67b3bb5b526713cb
            notes: Primeira versão nativa para Android 7+, com instalação de PKG e envio direto de payloads para PS4 e PS5.
          - version: 1.1.0
            commit: 845d75cd5f553216a226d9059a0f6a4b5a6c6653
            notes: Interface aprimorada, compartilhamento de links, validação preventiva de payloads e diagnóstico de suporte.
          - version: 1.2.0
            commit: 016661db354c31eaef8622a5ac95b00490ed40c3
            notes: Redesign inspirado no Duskaryon, com cartões translúcidos, navegação em etapas e identidade visual Akirabox.

    steps:
      - name: Checkout historical version
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.commit }}

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate version
        shell: bash
        run: |
          grep -F "versionName \"${{ matrix.version }}\"" app/build.gradle
          bash ./scripts/test-core.sh

      - name: Build installable APKs
        run: >-
          gradle --no-daemon
          :app:lintArmv7Debug
          :app:lintArm64Debug
          :app:lintUniversalDebug
          :app:assembleArmv7Debug
          :app:assembleArm64Debug
          :app:assembleUniversalDebug

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/armv7/debug/app-armv7-debug.apk dist/Akirabox-Android7-armeabi-v7a.apk
          cp app/build/outputs/apk/arm64/debug/app-arm64-debug.apk dist/Akirabox-Android7-arm64-v8a.apk
          cp app/build/outputs/apk/universal/debug/app-universal-debug.apk dist/Akirabox-Android7-universal.apk
          cd dist
          sha256sum *.apk > SHA256SUMS.txt

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ matrix.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --target "${{ matrix.commit }}" \
              --title "Akirabox ${{ matrix.version }}" \
              --notes "${{ matrix.notes }}"
          fi
