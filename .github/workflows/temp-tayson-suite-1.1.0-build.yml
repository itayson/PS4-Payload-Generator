name: Temporary Tayson PS4 Suite 1.1.0 Build

on:
  push:
    branches:
      - build/tayson-ps4-suite-1.1.0

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore validated Link Sender 1.0.1 source artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          curl -fL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o /tmp/linksender101.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10277427365/zip"
          rm -rf /tmp/linksender101 /tmp/TaysonPS4Suite-1.1.0
          mkdir -p /tmp/linksender101 /tmp/TaysonPS4Suite-1.1.0
          unzip -q /tmp/linksender101.zip -d /tmp/linksender101
          test -s /tmp/linksender101/TaysonPS4LinkSender-1.0.1-source.tar.gz
          tar -xzf /tmp/linksender101/TaysonPS4LinkSender-1.0.1-source.tar.gz \
            -C /tmp/TaysonPS4Suite-1.1.0 --strip-components=1
          test -f /tmp/TaysonPS4Suite-1.1.0/app/src/main/java/com/tayson/ps4linksender/MainActivity.kt
          test -f /tmp/TaysonPS4Suite-1.1.0/ps4receiver/receiver/main.c

      - name: Apply Suite 1.1.0 live monitor updates
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/TaysonPS4Suite-1.1.0
          python3 "$GITHUB_WORKSPACE/ci110/apply_android110.py"
          python3 "$GITHUB_WORKSPACE/ci110/apply_receiver110.py"

          grep -q 'versionCode = 16' app/build.gradle.kts
          grep -q 'versionName = "1.1.0"' app/build.gradle.kts
          grep -q 'Downloads no PS4' app/src/main/java/com/tayson/ps4linksender/MainActivity.kt
          grep -q 'MONITOR_INTERVAL_MS' app/src/main/java/com/tayson/ps4linksender/MainActivity.kt
          grep -q 'Format.redactUrl' app/src/main/java/com/tayson/ps4linksender/MainActivity.kt
          grep -q 'TAYSON/1 STATUS' app/src/main/java/com/tayson/ps4linksender/ps4/ReceiverClient.kt
          grep -q 'RECEIVER_VERSION "1.1.0"' ps4receiver/receiver/main.c
          grep -q 'respond_status' ps4receiver/receiver/main.c
          grep -q 'job_transfer_progress' ps4receiver/receiver/main.c
          grep -q 'PROXY_WORKER_STACK_SIZE' ps4receiver/receiver/main.c
          grep -q 'VERSION     := 1.10' ps4receiver/Makefile

      - name: Lint and build Android 1.1.0
        shell: bash
        run: |
          set -o pipefail
          cd /tmp/TaysonPS4Suite-1.1.0
          gradle --no-daemon :app:lintUniversalDebug :app:assembleUniversalDebug \
            2>&1 | tee android-build-1.1.0.log
          test -s app/build/outputs/apk/universal/debug/app-universal-debug.apk

      - name: Install OpenOrbis PS4 Toolchain 0.5.4
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v ld.lld >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y lld
          fi
          curl -fL --retry 3 --retry-delay 3 \
            -o /tmp/openorbis-toolchain.tar.gz \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz
          echo '3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  /tmp/openorbis-toolchain.tar.gz' | sha256sum -c -
          rm -rf /tmp/openorbis
          mkdir -p /tmp/openorbis
          tar -xzf /tmp/openorbis-toolchain.tar.gz -C /tmp/openorbis
          LINKX="$(find /tmp/openorbis -type f -name link.x -print -quit)"
          test -n "$LINKX"
          TOOLROOT="$(dirname "$LINKX")"
          echo "OO_PS4_TOOLCHAIN=$TOOLROOT" >> "$GITHUB_ENV"
          test -x "$TOOLROOT/bin/linux/create-fself"
          test -x "$TOOLROOT/bin/linux/PkgTool.Core"
          test -x "$TOOLROOT/bin/linux/create-gp4"

      - name: Refresh OpenOrbis runtime modules
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/TaysonPS4Suite-1.1.0
          mkdir -p ps4receiver/sce_module ps4receiver/sce_sys/about
          for module in libc.prx libSceFios2.prx; do
            src="$(find "$OO_PS4_TOOLCHAIN" -type f -name "$module" -print -quit)"
            test -n "$src"
            cp "$src" "ps4receiver/sce_module/$module"
          done
          right="$(find "$OO_PS4_TOOLCHAIN" -type f -name right.sprx -print -quit || true)"
          if [ -n "$right" ]; then
            cp "$right" ps4receiver/sce_sys/about/right.sprx
          fi
          test -s ps4receiver/sce_module/libc.prx
          test -s ps4receiver/sce_module/libSceFios2.prx

      - name: Build and validate Receiver 1.1.0
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/TaysonPS4Suite-1.1.0
          make -C ps4receiver clean pkg.gp4 2>&1 | tee receiver-build-1.1.0.log
          test -s ps4receiver/eboot.bin
          test -s ps4receiver/build/receiver.elf
          test -s ps4receiver/pkg.gp4
          strings ps4receiver/build/receiver.elf | grep -q 'TAYSON/1 STATUS'
          strings ps4receiver/build/receiver.elf | grep -q '1.1.0'
          grep -q 'sce_module/libc.prx' ps4receiver/pkg.gp4
          grep -q 'sce_module/libSceFios2.prx' ps4receiver/pkg.gp4

          docker run --rm \
            -v /tmp/openorbis/OpenOrbis/PS4Toolchain:/oo:ro \
            -v /tmp/TaysonPS4Suite-1.1.0/ps4receiver:/work \
            -w /work ubuntu:20.04 \
            bash -lc 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libssl1.1 libicu66 zlib1g libcurl4 ca-certificates >/dev/null && /oo/bin/linux/PkgTool.Core pkg_build pkg.gp4 .'
          test -s ps4receiver/IV0000-TYRC00001_00-TAYSONRECEIVER00.pkg

      - name: Prepare Suite 1.1.0 artifacts
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/TaysonPS4Suite-1.1.0
          mkdir -p dist
          cp app/build/outputs/apk/universal/debug/app-universal-debug.apk \
            dist/Tayson-PS4-Link-Sender-1.1.0-universal-debug.apk
          cp ps4receiver/IV0000-TYRC00001_00-TAYSONRECEIVER00.pkg \
            dist/Tayson-PS4-Receiver-1.1.0.pkg
          cp android-build-1.1.0.log receiver-build-1.1.0.log dist/
          tar -czf dist/TaysonPS4Suite-1.1.0-source.tar.gz \
            --exclude='./dist' --exclude='./app/build' --exclude='./.gradle' .
          (
            cd dist
            sha256sum \
              Tayson-PS4-Link-Sender-1.1.0-universal-debug.apk \
              Tayson-PS4-Receiver-1.1.0.pkg \
              TaysonPS4Suite-1.1.0-source.tar.gz > SHA256SUMS.txt
          )
          cat dist/SHA256SUMS.txt

      - name: Upload Suite 1.1.0
        uses: actions/upload-artifact@v4
        with:
          name: Tayson-PS4-Suite-1.1.0
          path: /tmp/TaysonPS4Suite-1.1.0/dist/*
          if-no-files-found: error
          retention-days: 30
